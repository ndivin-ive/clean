/* ───────────────────────── rules engine (mirrors brief §6 defaults) ───────────────────────── */
const RULES = {
  weights: { objective: 15, success: 15, outcomes: 5, attendees: 15, dm: 5, senior: 5, plan: 10, opp: 5, topics: 10, followup: 5, leadtime: 10 },
  typePoints: { technical_deep_dive: 5, pricing_review: 3, contract_review: 4, discovery_call: 2, demo: 4, workshop: 6, business_case: 6, executive_briefing: 5, proof_of_concept: 10, onboarding_review: 3 },
  durationPoints: { "1h": 0, half_day: 2, full_day: 4 }, rolePoints: { lead: 3, co_present: 2, content: 1, coach: 0 },
  bands: [{ key: "light", max: 5, lead: 3, typical: "≈ 3 h" }, { key: "standard", max: 9, lead: 5, typical: "≈ 1 d" }, { key: "significant", max: 14, lead: 10, typical: "≈ 3 d" }, { key: "major", max: Infinity, lead: 15, typical: "≥ 1 wk" }],
};
const OUTCOME_WORDS = /\b(so that|in order to|decide|agree|approve|sign|afin|pour que|décid|valid|approuv|sign)/i;
const COMMIT_WORDS = /\b(agrees?|commits?|confirms?|signs?|names?|presents?|validates?|approves?|s’engage|confirme|valide|signe|présente|approuve)\b/i;
const TECH_WORDS = /\b(api|integration|intégration|architecture|security|sécurité|sso|network|réseau|migration)\b/gi;
function assess(a, hasOpp) {
  const W = RULES.weights, crit = [];
  const add = (key, pts, max) => crit.push({ key, pts, max, state: pts >= max ? "ok" : pts > 0 ? "part" : "no" });
  const obj = (a.objective || "").trim();
  add("objective", obj.length >= 60 && OUTCOME_WORDS.test(obj) ? W.objective : obj.length >= 25 ? Math.round(W.objective / 2) : 0, W.objective);
  const suc = (a.success || "").trim();
  add("success", suc.length >= 40 && COMMIT_WORDS.test(suc) ? W.success : suc.length >= 15 ? Math.round(W.success / 2) : 0, W.success);
  add("outcomes", (a.outcomes || []).length ? W.outcomes : 0, W.outcomes);
  const named = (a.attendees || []).filter((p) => p.name?.trim() && p.title?.trim()).length;
  add("attendees", named >= 2 ? W.attendees : named === 1 ? Math.round(W.attendees / 2) : 0, W.attendees);
  add("dm", (a.attendees || []).some((p) => p.role === "decision_maker" || p.role === "sponsor") ? W.dm : 0, W.dm);
  add("senior", a.senior ? W.senior : 0, W.senior);
  add("plan", { none: 0, informal: 5, documented: 10, formal: 10 }[a.plan] ?? 0, W.plan);
  add("opp", hasOpp ? W.opp : 0, W.opp);
  const top = (a.topics || "").trim();
  add("topics", top.length >= 50 ? W.topics : top.length >= 15 ? Math.round(W.topics / 2) : 0, W.topics);
  add("followup", (a.followup || "").trim().length >= 3 ? W.followup : 0, W.followup);
  // effort
  let points = (RULES.typePoints[a.type] ?? 0) + (RULES.durationPoints[a.duration] ?? 0) + (RULES.rolePoints[a.role] ?? 0) + (a.deliverables || []).length + (a.extras || []).length * 2;
  const band = RULES.bands.find((b) => points <= b.max);
  const wd = a.target ? workingDaysBetween(iso(TODAY), a.target) : 0;
  add("leadtime", wd >= band.lead ? W.leadtime : wd >= Math.ceil(band.lead / 2) ? Math.round(W.leadtime / 2) : 0, W.leadtime);
  const score = crit.reduce((s, c) => s + c.pts, 0);
  const flags = [];
  if (a.target && wd < band.lead) flags.push({ key: "tooSoon", vars: { n: band.lead } });
  if (["workshop", "executive_briefing"].includes(a.type) && !["c_level", "vp"].includes(a.senior)) flags.push({ key: "noSenior" });
  if (!(a.attendees || []).some((p) => p.role === "decision_maker" || p.role === "sponsor")) flags.push({ key: "noDm" });
  if (a.plan === "none" && a.role !== "coach") flags.push({ key: "noPlan" });
  if (!hasOpp && ["significant", "major"].includes(band.key)) flags.push({ key: "highNoOpp" });
  if (a.target && !a.confirmed) flags.push({ key: "notConfirmed" });
  const tech = (`${a.objective} ${a.topics}`.match(TECH_WORDS) || []).length;
  if (tech >= 2 && a.fn && a.fn !== "f5") flags.push({ key: "technical", info: true });
  const label = score >= 75 ? "ready" : score >= 50 ? "workable" : "needs";
  return { score, crit, points, band, wd, flags, label };
}

function homeHead(extra = "") {
  const m = me();
  return `<div class="page-head"><div><p class="eyebrow">${esc(t("roles." + S.role))}</p><h1>${esc(t("home.greet", { name: m.name.split(" ")[0] }))}</h1></div>${extra}</div>`;
}

function viewHome() { return { ae: homeAE, manager: homeManager, specialist: homeSpecialist, lead: homeLead, admin: homeAdmin }[S.role](); }

function homeAE() {
  const m = me(), opps = visibleOpps(), open = opps.filter(isOpenOpp);
  const closing = open.filter((o) => daysAgo(o.close) >= -30 && daysAgo(o.close) <= 0).length;
  const myReq = S.d.requests.filter((r) => r.requester === m.id);
  const acts = sortActions(S.d.actions.filter((x) => x.to === m.id && (x.status === "open" || daysAgo(x.doneAt || x.due) < 7)));
  const todo = [];
  for (const r of myReq.filter((r) => r.status === "needs_information")) todo.push(["bad", t("home.todoInfo", { r: reqTitle(r) }), `request-${r.id}`]);
  for (const o of open.filter((o) => !o.nextStep)) todo.push(["warn", t("home.todoNoStep", { d: o.name }), `deal-${o.id}`]);
  for (const o of open.filter((o) => ["s3", "s4"].includes(o.stage) && !isSupported(o))) todo.push(["", t("home.todoAskHelp", { d: o.name, s: L(stage(o.stage)) }), `request-new-${o.id}`]);
  return `<div class="page">${homeHead()}
    <section class="panel hero-cta"><div><h2>${t("dash.needExpert")}</h2><p>${t("dash.needExpertLead")}</p></div>
      <div class="btn-row">${allowedFns().slice(0, 4).map((f) => `<a class="btn" href="#ask-${f.id}">${esc(L(f))}</a>`).join("")}<a class="btn primary" href="#support">${t("dash.allSupport")} ›</a></div></section>
    <div class="kpis">${kpi(t("dash.kPipe"), money(sum(open, (o) => o.amount)), t("dash.deals", { n: open.length }))}${kpi(t("dash.kForecast"), money(sum(open, (o) => (o.amount * stage(o.stage).prob) / 100)))}${kpi(t("dash.kClosing"), closing)}${kpi(t("dash.kMyReq"), myReq.filter((r) => OPEN.includes(r.status)).length, myReq.some((r) => r.status === "needs_information") ? t("st.needs_information") : "", myReq.some((r) => r.status === "needs_information"))}</div>
    <div class="grid cols-2">
      ${panelChart(t("dash.myActions"), actionList(acts, "received"), `<a class="btn sm ghost" href="#actions">${t("dash.seeAll")} ›</a>`)}
      ${panelChart(t("dash.next"), todoList(todo), `<span class="count">${todo.length}</span>`)}
    </div>
    <div class="grid cols-2">
      ${panelChart(t("dash.myRequests"), myReq.length ? `<div class="next">${myReq.filter((r) => r.status !== "withdrawn").slice(-6).reverse().map((r) => `<a class="item" href="#request-${r.id}"><span class="sev ${r.status === "needs_information" ? "bad" : ["delivered", "outcome_recorded"].includes(r.status) ? "good" : ""}"></span><span>${esc(reqTitle(r))}<br><span class="muted small">${esc(L(fn(r.fn)))}</span></span>${statusChip(r.status)}</a>`).join("")}</div>` : `<p class="empty">${t("deal.noSupport")}</p>`, `<a class="btn sm ghost" href="#support">${t("dash.seeAll")} ›</a>`)}
      ${panelChart(t("dash.myPipeStage"), hbars(stageRows(open)))}
    </div></div>`;
}

function homeManager() {
  const m = me(), team = teamIds(m.id), opps = visibleOpps(), open = opps.filter(isOpenOpp), closed = opps.filter((o) => !isOpenOpp(o));
  const won = closed.filter((o) => stage(o.stage).won).length;
  const sup = closed.filter(isSupported), unsup = closed.filter((o) => !isSupported(o));
  const winOf = (xs) => pct(xs.filter((o) => stage(o.stage).won).length, xs.length);
  const sent = S.d.actions.filter((x) => x.from === m.id), overdue = sent.filter(actionOverdue).length;
  const teamReq = S.d.requests.filter((r) => team.has(r.requester) && OPEN.includes(r.status) && r.status !== "draft").length;
  const reps = S.d.users.filter((u) => team.has(u.id) && u.roles.includes("ae"));
  const repRows = reps.map((u) => { const xs = open.filter((o) => o.owner === u.id); return { label: u.name, value: sum(xs, (o) => o.amount), display: `${money(sum(xs, (o) => o.amount))} · ${xs.length}` }; }).sort((a, b) => b.value - a.value);
  const watch = open.map((o) => {
    const reasons = [];
    if (daysAgo(o.moved) > 30) reasons.push(["warn", t("dash.rStalled", { n: daysAgo(o.moved) })]);
    if (!o.nextStep) reasons.push(["warn", t("dash.rNoStep")]);
    if (["s3", "s4", "s5"].includes(o.stage) && !isSupported(o)) reasons.push(["", t("dash.rNoSupport")]);
    const d = -daysAgo(o.close); if (d >= 0 && d <= 14) reasons.push(["bad", t("dash.rClosing", { n: d })]);
    return { o, reasons };
  }).filter((x) => x.reasons.length).sort((a, b) => b.reasons.length - a.reasons.length);
  return `<div class="page">${homeHead(`<button class="btn primary" data-act="push-action">＋ ${t("dash.push")}</button>`)}
    ${note("dashMgr")}
    <div class="kpis">${kpi(t("dash.kTeamPipe"), money(sum(open, (o) => o.amount)), t("dash.deals", { n: open.length }))}${kpi(t("dash.kForecast"), money(sum(open, (o) => (o.amount * stage(o.stage).prob) / 100)))}${kpi(t("dash.kWinRate"), `${pct(won, closed.length)} %`, t("dash.closed", { n: closed.length }))}${kpi(t("dash.kTeamReq"), teamReq)}${kpi(t("dash.kOverdue"), overdue, overdue ? t("actions.overdue") : "", overdue > 0)}</div>
    <div class="grid cols-2">${panelChart(t("dash.byStage"), hbars(stageRows(open)))}${panelChart(t("dash.byRep"), hbars(repRows), `<a class="btn sm ghost" href="#team">${t("nav.team")} ›</a>`)}</div>
    ${panelChart(t("dash.watch"), watch.length ? `<div class="table-wrap"><table><thead><tr><th>${t("cols.name")}</th><th>${t("cols.owner")}</th><th>${t("cols.stage")}</th><th class="r">${t("cols.amount")}</th><th></th><th></th></tr></thead><tbody>${watch.map(({ o, reasons }) => `<tr><td><a href="#deal-${o.id}">${esc(o.name)}</a><div class="muted small">${esc(account(o.account).name)}</div></td><td>${esc(user(o.owner).name)}</td><td>${stageChip(stage(o.stage))}</td><td class="r num">${money(o.amount)}</td><td><div class="chips">${reasons.map(([c, txt]) => `<span class="chip ${c}">${esc(txt)}</span>`).join("")}</div></td><td>${o.owner !== m.id ? `<button class="btn sm" data-act="push-action" data-to="${o.owner}" data-opp="${o.id}">${t("dash.push")}</button>` : ""}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">${t("home.nothing")}</p>`, `<span class="count">${watch.length}</span>`)}
    <div class="grid cols-2">
      ${panelChart(t("dash.winSupport"), hbars([{ label: t("dash.withSupport"), value: winOf(sup), display: `${winOf(sup)} % · ${t("dash.closed", { n: sup.length })}` }, { label: t("dash.withoutSupport"), value: winOf(unsup), display: `${winOf(unsup)} % · ${t("dash.closed", { n: unsup.length })}` }], 100))}
      ${panelChart(t("dash.sentActions"), actionList(sortActions(sent).slice(0, 5), "sent"), `<a class="btn sm ghost" href="#actions">${t("dash.seeAll")} ›</a>`)}
    </div>
    ${note("actions")}</div>`;
}

function weekStart() { const d = new Date(TODAY); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return iso(d); }
function homeSpecialist() {
  const m = me(), mine = S.d.requests.filter((r) => r.assignee === m.id), ws = weekStart();
  const myEffort = S.d.requests.flatMap((r) => r.effort.filter((e) => e.user === m.id));
  const hoursWeek = sum(myEffort.filter((e) => e.date >= ws), (e) => e.hours);
  const active = mine.filter((r) => ["accepted", "scheduled"].includes(r.status));
  const booked = active.length * 6;
  const todo = [];
  for (const r of mine.filter((r) => r.status === "delivered")) todo.push(["bad", t("home.todoLog", { r: reqTitle(r) }), `request-${r.id}`]);
  for (const r of mine.filter((r) => r.status === "accepted")) todo.push(["warn", t("home.todoSchedule", { r: reqTitle(r) }), `request-${r.id}`]);
  const upcoming = mine.filter((r) => r.status === "scheduled").sort((a, b) => (a.booking || a.target).localeCompare(b.booking || b.target));
  return `<div class="page">${homeHead()}
    <div class="kpis">${kpi(t("dash.kActive"), active.length)}${kpi(t("dash.kHoursWeek"), `${hoursWeek} h`, t("dash.ofCapacity", { n: m.hours }))}${kpi(t("dash.kToLog"), mine.filter((r) => r.status === "delivered").length, "", mine.some((r) => r.status === "delivered"))}${kpi(t("dash.kUtil"), `${pct(booked, m.hours)} %`, `${booked} h / ${m.hours} h`, booked > m.hours)}</div>
    <div class="grid cols-2">
      ${panelChart(t("dash.next"), todoList(todo), `<span class="count">${todo.length}</span>`)}
      ${panelChart(t("dash.upcoming"), upcoming.length ? `<div class="next">${upcoming.map((r) => `<a class="item" href="#request-${r.id}"><span class="sev"></span><span>${esc(reqTitle(r))}<br><span class="muted small">${esc(L(fn(r.fn)))} · ${esc(user(r.requester).name)}</span></span><span class="chip num">${fmtDate(r.booking || r.target)}</span></a>`).join("")}</div>` : `<p class="empty">${t("home.nothing")}</p>`)}
    </div>
    ${panelChart(t("dash.hoursByActivity"), hbars(Object.keys(I18N.en.act).map((k) => { const h = sum(myEffort.filter((e) => e.activity === k), (e) => e.hours); return { label: t("act." + k), value: h, display: `${h} h` }; })))}</div>`;
}

function homeLead() {
  const fs = myFns(), ids = new Set(fs.map((f) => f.id)), q = S.d.requests.filter((r) => ids.has(r.fn) && r.status !== "draft");
  const fresh = q.filter((r) => r.status === "new");
  const ageOf = (r) => daysAgo((r.events.filter((e) => e.to === "new").at(-1)?.at || iso(TODAY)).slice(0, 10));
  const avgAge = fresh.length ? Math.round(sum(fresh, ageOf) / fresh.length) : 0;
  const decided = q.filter((r) => r.status !== "new" && r.status !== "needs_information" && r.status !== "withdrawn");
  const accepted = decided.filter((r) => r.status !== "declined").length;
  const members = [...new Set(fs.flatMap((f) => f.members))];
  const typeRows = Object.keys(ENG_TYPES).map((k) => { const n = q.filter((r) => r.answers.type === k).length; return { label: ENG_TYPES[k][S.lang === "fr" ? 1 : 0], value: n, display: String(n) }; }).filter((r) => r.value);
  return `<div class="page">${homeHead(`<a class="btn primary" href="#triage">${t("nav.triage")} ›</a>`)}
    <div class="kpis">${kpi(t("dash.kNew"), fresh.length, "", fresh.length > 0)}${kpi(t("dash.kWaiting"), q.filter((r) => r.status === "needs_information").length)}${kpi(t("dash.kAge"), t("dash.daysUnit", { n: avgAge }))}${kpi(t("dash.kAccept"), `${pct(accepted, decided.length)} %`, `${accepted} / ${decided.length}`)}</div>
    <div class="grid cols-2">
      ${panelChart(t("dash.queueTop"), todoList(q.filter((r) => ["new", "needs_information"].includes(r.status)).map((r) => [r.status === "new" ? "bad" : "warn", `${reqTitle(r)} · ${user(r.requester).name}`, `request-${r.id}`])), `<a class="btn sm ghost" href="#triage">${t("dash.seeAll")} ›</a>`)}
      ${panelChart(`${t("dash.capacity")} · ${fs.map((f) => L(f)).join(", ")}`, hbars(members.map((u) => { const b = S.d.requests.filter((r) => r.assignee === u && ["accepted", "scheduled"].includes(r.status)).length * 6, h = user(u).hours; return { label: user(u).name, value: pct(b, h), display: `${b} h / ${h} h` }; }), 100))}
    </div>
    ${panelChart(t("dash.demandByType"), hbars(typeRows))}</div>`;
}

/* request form: rendered from template JSON */
function fieldHtml(f, a, types) {
  const id = `f-${f.key}`, lbl = `${esc(L(f, "label"))}`, hint = f[`hint_${S.lang}`] ? `<span class="hint">${esc(f[`hint_${S.lang}`])}</span>` : "", rq = f.required ? "req" : "";
  const v = a[f.key];
  switch (f.type) {
    case "textarea": return `<div class="field"><label for="${id}" class="${rq}">${lbl}</label>${hint}<textarea id="${id}" data-field="${f.key}">${esc(v)}</textarea></div>`;
    case "text": return `<div class="field"><label for="${id}" class="${rq}">${lbl}</label>${hint}<input type="text" id="${id}" data-field="${f.key}" value="${esc(v)}"></div>`;
    case "date": return `<div class="field"><label for="${id}" class="${rq}">${lbl}</label><input type="date" id="${id}" data-field="${f.key}" value="${esc(v)}" min="${iso(TODAY)}"></div>`;
    case "checkbox": return `<div class="field"><label class="checks"><label><input type="checkbox" id="${id}" data-field="${f.key}" ${v ? "checked" : ""}> ${lbl}</label></label></div>`;
    case "select": return `<div class="field"><label for="${id}" class="${rq}">${lbl}</label>${hint}<select id="${id}" data-field="${f.key}"><option value="">${t("misc.none")}</option>${(f.key === "type" && types ? types.map((k) => OPT(k, ENG_TYPES[k][0], ENG_TYPES[k][1])) : f.options).map((o) => `<option value="${o.value}" ${o.value === v ? "selected" : ""}>${esc(L(o, "label"))}</option>`).join("")}</select></div>`;
    case "multi": return `<fieldset class="field" style="border:0;padding:0;margin:0"><legend class="lbl ${rq}">${lbl}</legend>${hint}<div class="checks">${f.options.map((o) => `<label><input type="checkbox" data-multi="${f.key}" value="${o.value}" ${(v || []).includes(o.value) ? "checked" : ""}> ${esc(L(o, "label"))}</label>`).join("")}</div></fieldset>`;
    case "attendees": return `<div class="field"><span class="lbl ${rq}">${lbl}</span>${hint}<div class="grid" id="attendees" style="gap:6px">${(v || []).map((p, i) => attendeeRow(p, i)).join("")}</div><div><button type="button" class="btn sm" data-act="add-attendee">＋ ${t("misc.add")}</button></div></div>`;
  }
  return "";
}
const attendeeRow = (p, i) => `<div class="attendee"><input type="text" aria-label="${t("cols.name")}" placeholder="${t("cols.name")}" data-att="${i}" data-k="name" value="${esc(p.name)}"><input type="text" aria-label="${t("cols.title")}" placeholder="${t("cols.title")}" data-att="${i}" data-k="title" value="${esc(p.title)}"><select aria-label="${t("cols.decision")}" data-att="${i}" data-k="role">${Object.keys(I18N.en.dr).map((k) => `<option value="${k}" ${p.role === k ? "selected" : ""}>${t("dr." + k)}</option>`).join("")}</select><button type="button" class="btn sm ghost" data-act="rm-attendee" data-i="${i}" aria-label="${t("misc.remove")}">✕</button></div>`;

function scorePanel(a, hasOpp) {

  return `<header><h2>${t("score.title")}</h2><span class="chip ${res.label === "ready" ? "good" : res.label === "workable" ? "warn" : "bad"}">${t("score." + res.label)}</span></header>
    <div class="gauge"><div class="ring" style="--p:${res.score};--c:${c}" role="img" aria-label="${res.score} / 100"><span class="num">${res.score}</span></div>
      <div><p class="eyebrow">${t("score.effort")}</p><p><b>${t("band." + res.band.key)}</b> <span class="muted num">· ${res.points} pts · ${res.band.typical}</span></p><p class="muted small">${t("score.lead", { n: res.band.lead, g: res.wd })}</p></div></div>
    <p class="eyebrow" style="padding:0 16px 6px">${t("score.why")}</p>

    <div class="flags"><p class="eyebrow">${t("score.flags")}</p>${res.flags.length ? res.flags.map((f) => `<div class="flag ${f.info ? "info" : ""}">${esc(t("flag." + f.key, f.vars))}</div>`).join("") : `<p class="muted small">${t("score.noFlags")}</p>`}</div>

function viewRequest(id) {
  const r0 = reqById(id); if (!r0) return viewNotFound();
  const r = enrich(r0), f = fn(r.fn), tpl = TEMPLATES[f.template], m = me();
  const isRequester = r.requester === m.id, isLead = S.role === "admin" || f.lead === m.id, isAssignee = r.assignee === m.id;
  const actions = [];
  if (isRequester && r.status === "draft") actions.push(`<a class="btn primary" href="#request-new-${r.opp}">${t("deal.edit")}</a>`);
  if (isRequester && r.status === "needs_information") actions.push(`<button class="btn primary" data-act="resubmit" data-id="${r.id}">${t("req.resubmit")}</button>`);
  if (isRequester && ["draft", "new", "needs_information", "accepted", "scheduled"].includes(r.status)) actions.push(`<button class="btn danger" data-act="withdraw" data-id="${r.id}">${t("req.withdraw")}</button>`);
  if (isLead && ["new", "needs_information"].includes(r.status)) actions.push(`<button class="btn primary" data-act="tri-accept" data-id="${r.id}">${t("tri.accept")}</button>`, `<button class="btn" data-act="tri-ask" data-id="${r.id}">${t("tri.askInfo")}</button>`, `<button class="btn danger" data-act="tri-decline" data-id="${r.id}">${t("tri.decline")}</button>`);
  if ((isLead || isAssignee) && r.status === "accepted") actions.push(`<button class="btn primary" data-act="schedule" data-id="${r.id}">${t("req.schedule")}</button>`);
  if ((isLead || isAssignee) && r.status === "scheduled") actions.push(`<button class="btn primary" data-act="deliver" data-id="${r.id}">${t("req.markDelivered")}</button>`);
  if (isLead && ["accepted", "scheduled"].includes(r.status)) actions.push(`<button class="btn" data-act="tri-reassign" data-id="${r.id}">${t("tri.reassign")}</button>`);
  const canEffort = (isAssignee || isLead || S.role === "specialist") && ["scheduled", "delivered", "outcome_recorded"].includes(r.status) && S.role !== "ae";
  const canOutcome = (isAssignee || isLead || isRequester) && r.status === "delivered";
  const total = r.effort.reduce((s, e) => s + e.hours, 0);
  const answers = tpl.schema.sections.map((s) => `<div class="section"><h3>${esc(L(s, "label"))}</h3><dl class="grid cols-2" style="margin:0">${s.fields.map((fl) => {
    let v = fl.key === "target" ? fmtDate(r.target) : r.answers[fl.key];
    if (fl.type === "multi") v = (v || []).map((x) => L(fl.options.find((o) => o.value === x) || { label: x }, "label")).join(", ");
    else if (fl.type === "select") v = v ? (fl.key === "type" && ENG_TYPES[v] ? ENG_TYPES[v][S.lang === "fr" ? 1 : 0] : L(fl.options.find((o) => o.value === v) || { label: v }, "label")) : "";
    else if (fl.type === "checkbox") v = v ? t("misc.yes") : t("misc.no");
    else if (fl.type === "attendees") v = (v || []).map((p) => `${p.name} · ${p.title} · ${t("dr." + p.role)}`).join("\n");
    return `<div><dt class="eyebrow">${esc(L(fl, "label"))}</dt><dd style="margin:2px 0 0;white-space:pre-line">${esc(v) || `<span class="muted">${t("misc.none")}</span>`}</dd></div>`; }).join("")}</dl></div>`).join("");
  return `<div class="page"><div class="page-head"><div><p class="crumbs">${opp(r.opp) ? `<a href="#deal-${r.opp}">${esc(opp(r.opp).name)}</a> › ` : ""}${esc(L(f))}</p><h1>${esc(reqTitle(r))}</h1>
      <p class="lead">${esc(user(r.requester).name)} → ${esc(L(f))}${r.assignee ? ` · ${t("cols.assigned")}: ${esc(user(r.assignee).name)}` : ""}${r0.booking ? ` · ${t("req.scheduled", { d: fmtDate(r0.booking) })}` : ""}</p></div>
      <div class="btn-row">${actions.join("")}</div></div>
    ${flowStrip(r.status)}

const ROUTES = {

const GUARD = { triage: ["lead", "admin"], "admin-functions": ["lead", "admin"], "admin-templates": ["lead", "admin"], "admin-stages": ["admin"], "admin-users": ["admin"], setup: ["admin"], assignments: ["specialist", "lead"], requests: ["ae", "manager", "admin"], support: ["ae", "manager", "admin"], team: ["manager"], actions: ["ae", "manager", "admin"], ask: ["ae", "manager", "admin"], "request-new": ["ae", "manager", "admin"] };
function parseRoute() {
  const h = (location.hash || "#home").slice(1);
  if (h === "signin") return { name: "signin" };
  for (const [pre, fnc] of [["request-new-", (id) => viewRequestNew(id)], ["ask-", (id) => viewRequestNew(null, id)], ["request-", viewRequest], ["deal-", viewDeal], ["account-", viewAccount]]) {
    if (h.startsWith(pre)) { const name = pre.slice(0, -1); return { name, view: GUARD[name] && !GUARD[name].includes(S.role) ? viewNotFound : () => fnc(h.slice(pre.length)) }; }
  }
  if (GUARD[h] && !GUARD[h].includes(S.role)) return { name: h, view: viewNotFound };
  return { name: ROUTES[h] ? h : "home", view: ROUTES[h] || viewHome };
}

/* ───────────────────────── events ───────────────────────── */
function persistDraft(silent) {
  const d = S.draft; if (!d) return;
  const { target, ...answers } = d.a;
  let r = d.reqId && reqById(d.reqId);
  if (!r) { r = { id: uid("r"), opp: d.opp, requester: me().id, fn: d.fn, status: "draft", answers, target, events: [{ from: null, to: "draft", by: me().id, at: new Date().toISOString() }], assignee: null, effort: [], outcome: null, version: 1 }; S.d.requests.push(r); d.reqId = r.id; }
  Object.assign(r, { fn: d.fn, opp: d.opp, answers, target });
  d.savedAt = new Date().toLocaleTimeString(locale(), { hour: "2-digit", minute: "2-digit" });
  const el = $("#saved-at"); if (el) el.textContent = t("req.draftSaved", { t: d.savedAt });
  if (!silent) toast(t("req.draftSaved", { t: d.savedAt }));
}
function refreshScore() { const el = $("#score"); if (el && S.draft) el.innerHTML = scorePanel({ ...S.draft.a, fn: S.draft.fn }, !!S.draft.opp); clearTimeout(refreshScore.h); refreshScore.h = setTimeout(() => persistDraft(true), 1200); }

document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.dataset.field && S.draft) { S.draft.a[el.dataset.field] = el.type === "checkbox" ? el.checked : el.value; refreshScore(); }
  else if (el.dataset.multi && S.draft) { const k = el.dataset.multi; S.draft.a[k] = [...document.querySelectorAll(`[data-multi="${k}"]:checked`)].map((x) => x.value); refreshScore(); }
  else if (el.dataset.att !== undefined && S.draft) { S.draft.a.attendees[+el.dataset.att][el.dataset.k] = el.value; refreshScore(); }
  else if (el.dataset.stage) { const s = stage(el.dataset.stage), k = el.dataset.k; s[k] = el.type === "checkbox" ? el.checked : k === "prob" ? Math.max(0, Math.min(100, +el.value)) : el.value; if (k === "won" && s.won) s.lost = false; if (k === "lost" && s.lost) s.won = false; }
});
document.addEventListener("change", (e) => {
  const el = e.target, act = el.dataset.act;
  if (act === "role") { S.role = el.value; store("clean.role", S.role); S.draft = null; S.bell = false; if (!["#home", ""].includes(location.hash)) location.hash = "home"; else render(); }
  else if (act === "lang-select") { S.lang = el.value; store("clean.lang", S.lang); render(); }
  else if (act === "move") moveDeal(el.dataset.opp, el.value);
  else if (act === "filter") { S.filters[el.dataset.k] = el.value; render(); }
  else if (act === "pick-fn") { S.draft.fn = el.value; S.draft.a.type = ""; render(); }
  else if (act === "pick-deal") { S.draft.opp = el.value || null; refreshScore(); }
  else if (act === "user-role-filter") { S.filters.userRole = el.value; render(); }
  else if (act === "pick-tpl") { S.tpl = el.value; render(); }
  else if (act === "notes") { document.body.classList.toggle("hide-notes", !el.checked); }
  else if (el.dataset.roleUser) { const u = user(el.dataset.roleUser); u.roles = el.checked ? [...new Set([...u.roles, el.value])] : u.roles.filter((x) => x !== el.value); toast(t("adm.saved")); }
  else if (el.dataset.manager) { user(el.dataset.manager).manager = el.value || null; toast(t("adm.saved")); }
  else if (el.dataset.stage) { toast(t("adm.saved")); render(); }
});
function moveDeal(oppId, to) {
  const o = opp(oppId); if (!o || o.stage === to) return;
  o.history.push({ from: o.stage, to, at: iso(TODAY) }); o.stage = to; o.moved = iso(TODAY);
  toast(`${o.name} → ${L(stage(to))}`); render();
}
document.addEventListener("submit", (e) => {
  if (e.target.method === "dialog") return; // let <dialog> forms close natively
  e.preventDefault();
  if (e.target.id === "req-form") {
    persistDraft(true);
    const r = reqById(S.draft.reqId), f = fn(r.fn);
    transition(r, "new"); notify(f.lead, `New request from ${me().name} needs triage.`, `Nouvelle demande de ${me().name} à trier.`, "triage");
    S.draft = null; toast(t("req.submitted", { f: L(f) })); location.hash = `request-${r.id}`;
  } else if (e.target.dataset.form === "signin") { S.authEmail = $("#au-email").value; S.authStep = "sent"; render(); }
});
document.addEventListener("click", (e) => {

    case "outcome": openDialog(t("req.recordOutcome"), `<div class="field"><label for="dl-r">${t("req.result")}</label><select id="dl-r">${Object.keys(I18N.en.res).map((k) => `<option value="${k}">${t("res." + k)}</option>`).join("")}</select></div><div class="field"><label for="dl-i">${t("req.impact")}</label><input type="number" id="dl-i" min="1" max="5" value="4" required></div><div class="field"><label for="dl-n">${t("req.notes")}</label><textarea id="dl-n"></textarea></div>`, t("misc.save"), (d) => { r.outcome = { result: d.querySelector("#dl-r").value, impact: Math.max(1, Math.min(5, +d.querySelector("#dl-i").value)), notes: d.querySelector("#dl-n").value }; if (transition(r, "outcome_recorded")) { notify(r.requester, `Outcome recorded for “${reqTitle(r)}”.`, `Résultat enregistré pour « ${reqTitle(r)} ».`, `request-${r.id}`); render(); } }); break;
    case "new-deal": openDialog(t("pipe.newDeal"), `<div class="field"><label for="dl-n" class="req">${t("cols.name")}</label><input type="text" id="dl-n" required></div><div class="field"><label for="dl-acc">${t("cols.account")}</label><select id="dl-acc">${S.d.accounts.map((a) => `<option value="${a.id}">${esc(a.name)}</option>`).join("")}</select></div><div class="inline-fields"><div class="field"><label for="dl-am">${t("cols.amount")} (EUR)</label><input type="number" id="dl-am" min="0" step="1000" value="50000"></div><div class="field"><label for="dl-cd">${t("cols.close")}</label><input type="date" id="dl-cd" value="${addDays(60)}"></div></div>`, t("misc.add"), (d) => { const name = d.querySelector("#dl-n").value.trim(); if (!name) return; S.d.opps.push({ id: uid("o"), account: d.querySelector("#dl-acc").value, owner: me().id, name, amount: +d.querySelector("#dl-am").value, currency: "EUR", stage: "s1", close: d.querySelector("#dl-cd").value, moved: iso(TODAY), whyNow: "", nextStep: "", history: [{ to: "s1", at: iso(TODAY) }] }); toast(name); render(); }); break;
    case "new-account": openDialog(t("acc.new"), `<div class="field"><label for="dl-n" class="req">${t("cols.name")}</label><input type="text" id="dl-n" required></div><div class="inline-fields"><div class="field"><label for="dl-c">${t("cols.country")}</label><input type="text" id="dl-c" maxlength="2" value="FR"></div><div class="field"><label for="dl-i">${t("cols.industry")}</label><input type="text" id="dl-i"></div></div><div class="field"><label for="dl-r">${t("cols.relationship")}</label><select id="dl-r">${Object.keys(I18N.en.rel).map((k) => `<option value="${k}">${t("rel." + k)}</option>`).join("")}</select></div>`, t("misc.add"), (d) => { const name = d.querySelector("#dl-n").value.trim(); if (!name) return; S.d.accounts.push({ id: uid("a"), name, country: d.querySelector("#dl-c").value.toUpperCase(), industry: d.querySelector("#dl-i").value, rel: d.querySelector("#dl-r").value, owner: me().id }); render(); }); break;
    case "import": openImport(); break;
    case "add-stage": S.d.stages.splice(S.d.stages.length - 2, 0, { id: uid("s"), name_en: "New stage", name_fr: "Nouvelle étape", prob: 60, won: false, lost: false }); render(); break;
    case "stage-up": case "stage-down": { const i = +b.dataset.i, j = act === "stage-up" ? i - 1 : i + 1; [S.d.stages[i], S.d.stages[j]] = [S.d.stages[j], S.d.stages[i]]; render(); break; }
    case "new-version": { const tpl = TEMPLATES[S.tpl]; if (tpl.versions.some((v) => v.status === "draft")) { toast(t("adm.draftV") + " ✓"); break; } tpl.versions.push({ v: tpl.versions.at(-1).v + 1, status: "draft", at: iso(TODAY) }); render(); break; }
    case "invite": openDialog(t("adm.invite"), `<div class="field"><label for="dl-e" class="req">${t("cols.email")}</label><input type="email" id="dl-e" required placeholder="name@company.example"></div><div class="field"><span class="lbl">${t("cols.roles")}</span><div class="checks">${Object.keys(I18N.en.roles).map((k) => `<label><input type="checkbox" name="inv-role" value="${k}" ${k === "ae" ? "checked" : ""}> ${t("roles." + k)}</label>`).join("")}</div></div>`, t("adm.inviteSend"), (d) => { const email = d.querySelector("#dl-e").value.trim(); if (!email.includes("@")) return; S.d.invitations.push({ email, roles: [...d.querySelectorAll('[name="inv-role"]:checked')].map((x) => x.value) }); toast(t("adm.invited", { e: email })); render(); }); break;
    case "push-action": pushActionDialog(b.dataset.to, b.dataset.opp); break;
    case "action-done": { const x = S.d.actions.find((a) => a.id === id); if (x) { x.status = "done"; x.doneAt = iso(TODAY); notify(x.from, `${me().name} completed: “${x.title}”.`, `${me().name} a terminé : « ${x.title} ».`, "actions"); toast(t("actions.doneMsg")); render(); } break; }
    case "actions-filter": S.filters.actions = b.dataset.v; render(); break;
    case "create-user": userDialog(null); break;
    case "edit-user": userDialog(user(id)); break;
    case "new-type": typeDialog(null); break;
    case "edit-type": typeDialog(fn(id)); break;
    case "setup-back": S.setupStep = Math.max(1, S.setupStep - 1); render(); break;
    case "setup-next": if (S.setupStep < 4) { S.setupStep++; render(); } else { S.setupStep = 1; toast(t("setup.done")); location.hash = "home"; } break;
  }
});
/* drag and drop on the board */
document.addEventListener("dragstart", (e) => { const c = e.target.closest?.(".card[data-opp]"); if (c) { e.dataTransfer.setData("text/plain", c.dataset.opp); e.dataTransfer.effectAllowed = "move"; } });
document.addEventListener("dragover", (e) => { const col = e.target.closest?.(".col"); if (col) { e.preventDefault(); document.querySelectorAll(".col.drop").forEach((x) => x !== col && x.classList.remove("drop")); col.classList.add("drop"); } });
document.addEventListener("dragleave", (e) => { const col = e.target.closest?.(".col"); if (col && !col.contains(e.relatedTarget)) col.classList.remove("drop"); });
document.addEventListener("drop", (e) => { const col = e.target.closest?.(".col"); if (col) { e.preventDefault(); col.classList.remove("drop"); moveDeal(e.dataTransfer.getData("text/plain"), col.dataset.stage); } });

/* CSV import */
function parseCsv(text) {
  const rows = text.split(/\r?\n/).filter((l) => l.trim()).map((l) => { const out = []; let cur = "", q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === "," && !q) { out.push(cur.trim()); cur = ""; } else cur += ch; } out.push(cur.trim()); return out; });
  if (rows.length && rows[0][0].toLowerCase() === "name") rows.shift();
  return rows.map(([name = "", country = "", industry = "", rel = "new_logo"]) => {
    const errors = []; if (!name) errors.push("name"); if (country && !/^[A-Za-z]{2}$/.test(country)) errors.push("country"); if (!["new_logo", "expand", "retain"].includes(rel)) errors.push("relationship");
    return { name, country: country.toUpperCase(), industry, rel, errors };
  });
}
function openImport() {
  const sample = "name,country,industry,relationship\nKestrel Shipping,DK,Logistics,new_logo\nLoire Valley Wines,FR,Food & beverage,expand\nMeridian Clinics,XX1,Healthcare,retain\n,FR,Retail,new_logo";
  openDialog(t("acc.importTitle"), `<p class="muted small">${t("acc.importHint")}</p><input type="file" id="dl-file" accept=".csv,text/csv" aria-label="${t("acc.chooseFile")}"><textarea id="dl-csv" style="font-family:var(--mono);font-size:0.8rem;min-height:110px">${sample}</textarea><div id="dl-prev"></div>`, t("acc.import"), (d) => {
    const ok = parseCsv(d.querySelector("#dl-csv").value).filter((r) => !r.errors.length);
    ok.forEach((r) => S.d.accounts.push({ id: uid("a"), name: r.name, country: r.country, industry: r.industry, rel: r.rel, owner: me().id }));
    toast(t("acc.imported", { n: ok.length })); render();
  });
  const d = $("#dlg"), prev = () => { const rows = parseCsv(d.querySelector("#dl-csv").value), bad = rows.filter((r) => r.errors.length).length;
    d.querySelector("#dl-prev").innerHTML = `<div class="chips"><span class="chip good">${t("acc.rowsOk", { n: rows.length - bad })}</span>${bad ? `<span class="chip bad">${t("acc.rowsBad", { n: bad })}</span>` : ""}</div><div class="table-wrap" style="max-height:180px;margin-top:8px"><table><tbody>${rows.map((r) => `<tr><td>${esc(r.name) || "<em>?</em>"}</td><td>${esc(r.country)}</td><td>${r.errors.length ? `<span class="chip bad">${esc(r.errors.join(", "))}</span>` : `<span class="chip good">✓</span>`}</td></tr>`).join("")}</tbody></table></div>`; };
  d.querySelector("#dl-csv").addEventListener("input", prev);
  d.querySelector("#dl-file").addEventListener("change", (e) => { const f = e.target.files[0]; if (!f) return; const fr = new FileReader(); fr.onload = () => { d.querySelector("#dl-csv").value = fr.result; prev(); }; fr.readAsText(f); });
  prev();
}

window.addEventListener("hashchange", () => { document.body.classList.remove("nav-open"); S.bell = false; render(); window.scrollTo(0, 0); });
render();
</script>

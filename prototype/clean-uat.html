/* top bar */

  display: flex; align-items: center; gap: 12px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.brand { font-weight: 750; letter-spacing: 0.08em; display: flex; align-items: center; gap: 10px; }
.brand-mark { display: inline-grid; grid-template-columns: repeat(5, 6px); gap: 2px; }
.brand-mark i { height: 14px; background: var(--accent); border-radius: 1px; opacity: 0.35; }
.brand-mark i:nth-child(1) { opacity: 1; } .brand-mark i:nth-child(2) { opacity: 0.85; } .brand-mark i:nth-child(3) { opacity: 0.7; } .brand-mark i:nth-child(4) { opacity: 0.55; }

.ctl label { color: var(--muted); }
select, input[type="text"], input[type="email"], input[type="date"], input[type="number"], textarea {
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; min-width: 0; }
textarea { width: 100%; min-height: 76px; resize: vertical; }
.btn.menu-btn { display: none; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); border-radius: 6px;
  padding: 6px 12px; cursor: pointer; font-weight: 550; text-decoration: none; color: var(--fg); white-space: nowrap; }
.btn:hover { background: var(--sunken); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { padding: 3px 8px; font-size: 0.82rem; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* shell */
.shell { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: calc(100vh - 90px); }
nav.side { border-right: 1px solid var(--border); background: var(--surface); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
nav.side .group { margin: 14px 8px 4px; }

main { min-width: 0; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-head .lead { color: var(--muted); margin-top: 4px; max-width: 70ch; }
.crumbs { font-size: 0.82rem; color: var(--muted); margin-bottom: 4px; }
.crumbs a { color: var(--muted); }

/* surfaces */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); }

.panel > .body { padding: 16px; }
.grid { display: grid; gap: 16px; }
.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.stat { padding: 14px 16px; }
.stat .v { font-size: 1.45rem; font-weight: 650; margin-top: 2px; }
.next { display: flex; flex-direction: column; }
.next a.item { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--border); text-decoration: none; color: var(--fg); }
.next a.item:first-child { border-top: 0; }
.next a.item:hover { background: var(--sunken); }
.sev { width: 8px; height: 8px; border-radius: 99px; background: var(--accent); }
.sev.bad { background: var(--bad); } .sev.warn { background: var(--warn); } .sev.good { background: var(--good); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

/* tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; background: var(--sunken); white-space: nowrap; }
tbody tr:hover { background: var(--sunken); }
td.r, th.r { text-align: right; }
tr.link { cursor: pointer; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--sunken); color: var(--muted); white-space: nowrap; }
.chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }

/* kanban */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--sunken); border: 1px solid var(--border); border-radius: var(--r); display: flex; flex-direction: column; min-height: 240px; }
.col.drop { outline: 2px dashed var(--accent); outline-offset: -2px; }
.col > header { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.col > header .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
.cards { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px; cursor: grab; display: flex; flex-direction: column; gap: 6px; }
.card:hover { border-color: var(--accent); }
.card .t { font-weight: 600; }
.card .row { display: flex; justify-content: space-between; gap: 8px; font-size: 0.82rem; color: var(--muted); }
.card select { font-size: 0.78rem; padding: 2px 4px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* forms */
.form { display: flex; flex-direction: column; gap: 16px; }
.section { display: flex; flex-direction: column; gap: 12px; }
.section + .section { border-top: 1px solid var(--border); padding-top: 16px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > label, .field > .lbl { font-weight: 600; font-size: 0.88rem; }
.field .hint { color: var(--muted); font-size: 0.8rem; }
.req::after { content: " *"; color: var(--bad); }
.checks { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; font-weight: 400; }
.attendee { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 170px 32px; gap: 6px; }
.inline-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }

.score { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 0; }
.gauge { display: flex; gap: 14px; align-items: center; padding: 16px; }
.ring { --p: 0; --c: var(--accent); width: 76px; height: 76px; border-radius: 50%; flex: none;

.ring span { width: 60px; height: 60px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 1.3rem; font-weight: 700; }
.breakdown { list-style: none; margin: 0; padding: 0 16px 12px; display: flex; flex-direction: column; gap: 4px; }

.timeline li::before { content: ""; position: absolute; left: 6px; top: 14px; bottom: 0; width: 2px; background: var(--border); }

.bar { height: 8px; background: var(--sunken); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }

dialog { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--fg); padding: 0; width: min(520px, calc(100vw - 32px)); box-shadow: var(--shadow); }

dialog header { padding: 14px 18px; border-bottom: 1px solid var(--border); }

@media (max-width: 1100px) {

  .topbar { flex-wrap: wrap; }

@media (prefers-reduced-motion: no-preference) {
  .ring { transition: background 0.3s; }
}

/* ───────────────────────── rules engine (mirrors brief §6 defaults) ───────────────────────── */
const RULES = {
  weights: { objective: 15, success: 15, outcomes: 5, attendees: 15, dm: 5, senior: 5, plan: 10, opp: 5, topics: 10, followup: 5, leadtime: 10 },
  typePoints: { discovery_call: 2, demo: 4, workshop: 6, business_case: 6, executive_briefing: 5, proof_of_concept: 10, onboarding_review: 3 },
  durationPoints: { "1h": 0, half_day: 2, full_day: 4 }, rolePoints: { lead: 3, co_present: 2, content: 1, coach: 0 },
  bands: [{ key: "light", max: 5, lead: 3, typical: "≈ 3 h" }, { key: "standard", max: 9, lead: 5, typical: "≈ 1 d" }, { key: "significant", max: 14, lead: 10, typical: "≈ 3 d" }, { key: "major", max: Infinity, lead: 15, typical: "≥ 1 wk" }],
};
const OUTCOME_WORDS = /\b(so that|in order to|decide|agree|approve|sign|afin|pour que|décid|valid|approuv|sign)/i;
const COMMIT_WORDS = /\b(agrees?|commits?|confirms?|signs?|names?|presents?|validates?|approves?|s’engage|confirme|valide|signe|présente|approuve)\b/i;
const TECH_WORDS = /\b(api|integration|intégration|architecture|security|sécurité|sso|network|réseau|migration)\b/gi;
function assess(a, hasOpp) {
  const W = RULES.weights, crit = [];
  const add = (key, pts, max) => crit.push({ key, pts, max, state: pts >= max ? "ok" : pts > 0 ? "part" : "no" });
  const obj = (a.objective || "").trim();
  add("objective", obj.length >= 60 && OUTCOME_WORDS.test(obj) ? W.objective : obj.length >= 25 ? Math.round(W.objective / 2) : 0, W.objective);
  const suc = (a.success || "").trim();
  add("success", suc.length >= 40 && COMMIT_WORDS.test(suc) ? W.success : suc.length >= 15 ? Math.round(W.success / 2) : 0, W.success);
  add("outcomes", (a.outcomes || []).length ? W.outcomes : 0, W.outcomes);
  const named = (a.attendees || []).filter((p) => p.name?.trim() && p.title?.trim()).length;
  add("attendees", named >= 2 ? W.attendees : named === 1 ? Math.round(W.attendees / 2) : 0, W.attendees);
  add("dm", (a.attendees || []).some((p) => p.role === "decision_maker" || p.role === "sponsor") ? W.dm : 0, W.dm);
  add("senior", a.senior ? W.senior : 0, W.senior);
  add("plan", { none: 0, informal: 5, documented: 10, formal: 10 }[a.plan] ?? 0, W.plan);
  add("opp", hasOpp ? W.opp : 0, W.opp);
  const top = (a.topics || "").trim();
  add("topics", top.length >= 50 ? W.topics : top.length >= 15 ? Math.round(W.topics / 2) : 0, W.topics);
  add("followup", (a.followup || "").trim().length >= 3 ? W.followup : 0, W.followup);
  // effort
  let points = (RULES.typePoints[a.type] ?? 0) + (RULES.durationPoints[a.duration] ?? 0) + (RULES.rolePoints[a.role] ?? 0) + (a.deliverables || []).length + (a.extras || []).length * 2;
  const band = RULES.bands.find((b) => points <= b.max);
  const wd = a.target ? workingDaysBetween(iso(TODAY), a.target) : 0;
  add("leadtime", wd >= band.lead ? W.leadtime : wd >= Math.ceil(band.lead / 2) ? Math.round(W.leadtime / 2) : 0, W.leadtime);
  const score = crit.reduce((s, c) => s + c.pts, 0);
  const flags = [];
  if (a.target && wd < band.lead) flags.push({ key: "tooSoon", vars: { n: band.lead } });
  if (["workshop", "executive_briefing"].includes(a.type) && !["c_level", "vp"].includes(a.senior)) flags.push({ key: "noSenior" });
  if (!(a.attendees || []).some((p) => p.role === "decision_maker" || p.role === "sponsor")) flags.push({ key: "noDm" });
  if (a.plan === "none" && a.role !== "coach") flags.push({ key: "noPlan" });
  if (!hasOpp && ["significant", "major"].includes(band.key)) flags.push({ key: "highNoOpp" });
  if (a.target && !a.confirmed) flags.push({ key: "notConfirmed" });
  const tech = (`${a.objective} ${a.topics}`.match(TECH_WORDS) || []).length;
  if (tech >= 2 && a.fn && a.fn !== "f1") flags.push({ key: "technical", info: true });
  const label = score >= 75 ? "ready" : score >= 50 ? "workable" : "needs";
  return { score, crit, points, band, wd, flags, label };
}

const OPEN = ["draft", "new", "needs_information", "accepted", "scheduled", "delivered"];
const TRANSITIONS = { draft: ["new", "withdrawn"], new: ["accepted", "needs_information", "declined", "withdrawn"], needs_information: ["new", "declined", "withdrawn"], accepted: ["scheduled", "withdrawn"], scheduled: ["delivered", "withdrawn"], delivered: ["outcome_recorded"], outcome_recorded: [], declined: [], withdrawn: [] };
const FLOW = ["draft", "new", "accepted", "scheduled", "delivered", "outcome_recorded"];
function transition(r, to, note) {
  if (!TRANSITIONS[r.status].includes(to)) { toast(`✕ ${r.status} → ${to}`); return false; }
  r.events.push({ from: r.status, to, by: me().id, at: new Date().toISOString(), note });
  r.status = to; return true;
}
function notify(userId, en, fr, link) { S.d.notifications.unshift({ id: uid("n"), user: userId, text_en: en, text_fr: fr, link, unread: true }); }

/* ───────────────────────── small components ───────────────────────── */
const statusChip = (s) => { const cls = { draft: "", new: "accent", needs_information: "warn", accepted: "accent", scheduled: "accent", delivered: "good", outcome_recorded: "good", declined: "bad", withdrawn: "" }[s]; return `<span class="chip ${cls}">${esc(t("st." + s))}</span>`; };
const scoreChip = (n) => n == null ? t("misc.none") : `<span class="chip ${n >= 75 ? "good" : n >= 50 ? "warn" : "bad"} num">${n}</span>`;
const stageChip = (s) => `<span class="chip ${s.won ? "good" : s.lost ? "bad" : ""}">${esc(L(s))}</span>`;
const note = (k) => `<div class="note">${t("notes." + k)}</div>`;
const flowStrip = (status) => {
  if (status === "declined" || status === "withdrawn") return `<div class="flow">${statusChip(status)}</div>`;
  const at = FLOW.indexOf(status === "needs_information" ? "new" : status);
  return `<div class="flow">${FLOW.map((s, i) => `<span class="${i < at ? "done" : i === at ? "now" : ""}">${esc(t("st." + (s === "new" && status === "needs_information" ? "needs_information" : s)))}</span>`).join("<i>›</i>")}</div>`;
};
const reqTitle = (r) => (opp(r.opp) ? opp(r.opp).name : t("req.noOpp"));
const enrich = (r) => { const res = assess({ ...r.answers, target: r.target, fn: r.fn }, !!r.opp); return { ...r, res }; };
function toast(msg) { S.toast = msg; renderToast(); clearTimeout(toast.h); toast.h = setTimeout(() => { S.toast = null; renderToast(); }, 2600); }
function renderToast() { let el = $(".toast"); if (!S.toast) { el?.remove(); return; } if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.append(el); } el.textContent = S.toast; }

function viewHome() {
  const m = me(), items = [];
  const opps = visibleOpps(), open = opps.filter((o) => !stage(o.stage).won && !stage(o.stage).lost);
  const stats = [];
  if (["ae", "manager", "admin"].includes(S.role)) {
    const total = open.reduce((s, o) => s + o.amount, 0), weighted = open.reduce((s, o) => s + o.amount * stage(o.stage).prob / 100, 0);
    const closing = open.filter((o) => daysAgo(o.close) >= -30 && daysAgo(o.close) <= 0).length;
    const myReq = S.d.requests.filter((r) => (S.role === "admin" || r.requester === m.id || (S.role === "manager" && teamIds(m.id).has(r.requester))) && OPEN.includes(r.status)).length;
    stats.push([t("home.openPipeline"), money(total)], [t("home.weighted"), money(weighted)], [t("home.closing30"), closing], [t("home.openRequests"), myReq]);
    for (const r of S.d.requests.filter((r) => r.requester === m.id && r.status === "needs_information")) items.push(["bad", t("home.todoInfo", { r: reqTitle(r) }), `request-${r.id}`]);
    for (const o of open.filter((o) => !o.nextStep && (S.role !== "manager" || o.owner === m.id))) items.push(["warn", t("home.todoNoStep", { d: o.name }), `deal-${o.id}`]);
    for (const o of open.filter((o) => ["s3", "s4"].includes(o.stage) && !S.d.requests.some((r) => r.opp === o.id && r.status !== "withdrawn"))) items.push(["", t("home.todoAskHelp", { d: o.name, s: L(stage(o.stage)) }), `deal-${o.id}`]);
    if (S.role !== "ae") for (const o of open.filter((o) => daysAgo(o.moved) > 30)) items.push(["warn", t("home.todoStalled", { d: o.name, n: daysAgo(o.moved) }), `deal-${o.id}`]);
  }
  if (S.role === "specialist" || S.role === "lead") {
    const mine = S.d.requests.filter((r) => r.assignee === m.id);
    stats.push([t("home.activeAssign"), mine.filter((r) => ["accepted", "scheduled"].includes(r.status)).length], [t("home.toLog"), mine.filter((r) => r.status === "delivered").length]);
    for (const r of mine.filter((r) => r.status === "delivered")) items.push(["bad", t("home.todoLog", { r: reqTitle(r) }), `request-${r.id}`]);
    for (const r of mine.filter((r) => r.status === "accepted")) items.push(["warn", t("home.todoSchedule", { r: reqTitle(r) }), `request-${r.id}`]);
  }
  if (S.role === "lead" || S.role === "admin") {
    const f = new Set(myFns().map((x) => x.id)), q = S.d.requests.filter((r) => f.has(r.fn));
    stats.push([t("home.newInQueue"), q.filter((r) => r.status === "new").length], [t("home.needsInfo"), q.filter((r) => r.status === "needs_information").length]);
    for (const r of q.filter((r) => r.status === "new")) items.push(["bad", t("home.todoTriage", { r: reqTitle(r), who: user(r.requester).name }), "triage"]);
  }
  let extra = "";
  if (S.role === "lead") {
    const f = myFns()[0];
    extra = `<section class="panel"><header><h2>${t("home.capacity")} · ${esc(L(f))}</h2></header><div class="body grid">${f.members.map((uId) => {
      const u = user(uId), booked = S.d.requests.filter((r) => r.assignee === uId && ["accepted", "scheduled"].includes(r.status)).length * 6, pct = u.hours ? Math.min(100, (booked / u.hours) * 100) : 0;
      return `<div><div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(u.name)}</span><span class="muted small num">${t("home.booked", { a: booked, b: u.hours })}</span></div><div class="bar"><i class="${booked > u.hours ? "over" : ""}" style="width:${pct}%"></i></div></div>`; }).join("")}</div></section>`;
  }
  if (S.role === "admin") {
    const done = [true, true, true, S.d.invitations.length === 0 && S.d.users.length > 3];
    extra = `<section class="panel"><header><h2>${t("home.setupList")}</h2><a class="btn sm" href="#setup">${t("nav.setup")}</a></header><div class="next">${[1, 2, 3, 4].map((n, i) => `<a class="item" href="#${["setup", "admin-stages", "admin-functions", "admin-users"][i]}"><span class="sev ${done[i] ? "good" : "warn"}"></span><span>${t("home.setup" + n)}</span><span class="chip ${done[i] ? "good" : "warn"}">${done[i] ? t("home.setupDone") : t("home.setupTodo")}</span></a>`).join("")}</div></section>`;
  }
  return `<div class="page">
    <div class="page-head"><div><p class="eyebrow">${esc(t("roles." + S.role))}</p><h1>${esc(t("home.greet", { name: m.name.split(" ")[0] }))}</h1></div></div>
    ${note("roles")}
    <div class="grid cols-4">${stats.slice(0, 4).map(([k, v]) => `<div class="panel stat"><p class="eyebrow">${esc(k)}</p><p class="v num">${esc(v)}</p></div>`).join("")}</div>
    <div class="grid ${extra ? "cols-2" : ""}">
      <section class="panel"><header><h2>${t("home.next")}</h2><span class="count">${items.length}</span></header>
        <div class="next">${items.length ? items.map(([sev, txt, href]) => `<a class="item" href="#${href}"><span class="sev ${sev}"></span><span>${esc(txt)}</span><span class="muted">›</span></a>`).join("") : `<p class="empty">${t("home.nothing")}</p>`}</div></section>
      ${extra}
    </div></div>`;
}

/* request form: rendered from template JSON */
function fieldHtml(f, a) {
  const id = `f-${f.key}`, lbl = `${esc(L(f, "label"))}`, hint = f[`hint_${S.lang}`] ? `<span class="hint">${esc(f[`hint_${S.lang}`])}</span>` : "", rq = f.required ? "req" : "";
  const v = a[f.key];
  switch (f.type) {
    case "textarea": return `<div class="field"><label for="${id}" class="${rq}">${lbl}</label>${hint}<textarea id="${id}" data-field="${f.key}">${esc(v)}</textarea></div>`;
    case "text": return `<div class="field"><label for="${id}" class="${rq}">${lbl}</label>${hint}<input type="text" id="${id}" data-field="${f.key}" value="${esc(v)}"></div>`;
    case "date": return `<div class="field"><label for="${id}" class="${rq}">${lbl}</label><input type="date" id="${id}" data-field="${f.key}" value="${esc(v)}" min="${iso(TODAY)}"></div>`;
    case "checkbox": return `<div class="field"><label class="checks"><label><input type="checkbox" id="${id}" data-field="${f.key}" ${v ? "checked" : ""}> ${lbl}</label></label></div>`;
    case "select": return `<div class="field"><label for="${id}" class="${rq}">${lbl}</label>${hint}<select id="${id}" data-field="${f.key}"><option value="">${t("misc.none")}</option>${f.options.map((o) => `<option value="${o.value}" ${o.value === v ? "selected" : ""}>${esc(L(o, "label"))}</option>`).join("")}</select></div>`;
    case "multi": return `<fieldset class="field" style="border:0;padding:0;margin:0"><legend class="lbl ${rq}">${lbl}</legend>${hint}<div class="checks">${f.options.map((o) => `<label><input type="checkbox" data-multi="${f.key}" value="${o.value}" ${(v || []).includes(o.value) ? "checked" : ""}> ${esc(L(o, "label"))}</label>`).join("")}</div></fieldset>`;
    case "attendees": return `<div class="field"><span class="lbl ${rq}">${lbl}</span>${hint}<div class="grid" id="attendees" style="gap:6px">${(v || []).map((p, i) => attendeeRow(p, i)).join("")}</div><div><button type="button" class="btn sm" data-act="add-attendee">＋ ${t("misc.add")}</button></div></div>`;
  }
  return "";
}

  return `<div class="page"><div class="page-head"><div><p class="crumbs"><a href="#pipeline">${t("nav.pipeline")}</a> › <a href="#deal-${o.id}">${esc(o.name)}</a></p><h1>${t("req.newTitle")}</h1></div></div>

function viewRequest(id) {
  const r0 = reqById(id); if (!r0) return viewNotFound();
  const r = enrich(r0), f = fn(r.fn), tpl = TEMPLATES[f.template], m = me();
  const isRequester = r.requester === m.id, isLead = S.role === "admin" || f.lead === m.id, isAssignee = r.assignee === m.id;
  const actions = [];
  if (isRequester && r.status === "draft") actions.push(`<a class="btn primary" href="#request-new-${r.opp}">${t("deal.edit")}</a>`);
  if (isRequester && r.status === "needs_information") actions.push(`<button class="btn primary" data-act="resubmit" data-id="${r.id}">${t("req.resubmit")}</button>`);
  if (isRequester && ["draft", "new", "needs_information", "accepted", "scheduled"].includes(r.status)) actions.push(`<button class="btn danger" data-act="withdraw" data-id="${r.id}">${t("req.withdraw")}</button>`);
  if (isLead && ["new", "needs_information"].includes(r.status)) actions.push(`<button class="btn primary" data-act="tri-accept" data-id="${r.id}">${t("tri.accept")}</button>`, `<button class="btn" data-act="tri-ask" data-id="${r.id}">${t("tri.askInfo")}</button>`, `<button class="btn danger" data-act="tri-decline" data-id="${r.id}">${t("tri.decline")}</button>`);
  if ((isLead || isAssignee) && r.status === "accepted") actions.push(`<button class="btn primary" data-act="schedule" data-id="${r.id}">${t("req.schedule")}</button>`);
  if ((isLead || isAssignee) && r.status === "scheduled") actions.push(`<button class="btn primary" data-act="deliver" data-id="${r.id}">${t("req.markDelivered")}</button>`);
  if (isLead && ["accepted", "scheduled"].includes(r.status)) actions.push(`<button class="btn" data-act="tri-reassign" data-id="${r.id}">${t("tri.reassign")}</button>`);
  const canEffort = (isAssignee || isLead || S.role === "specialist") && ["scheduled", "delivered", "outcome_recorded"].includes(r.status) && S.role !== "ae";
  const canOutcome = (isAssignee || isLead || isRequester) && r.status === "delivered";
  const total = r.effort.reduce((s, e) => s + e.hours, 0);
  const answers = tpl.schema.sections.map((s) => `<div class="section"><h3>${esc(L(s, "label"))}</h3><dl class="grid cols-2" style="margin:0">${s.fields.map((fl) => {
    let v = fl.key === "target" ? fmtDate(r.target) : r.answers[fl.key];
    if (fl.type === "multi") v = (v || []).map((x) => L(fl.options.find((o) => o.value === x) || { label: x }, "label")).join(", ");
    else if (fl.type === "select") v = v ? L(fl.options.find((o) => o.value === v) || { label: v }, "label") : "";
    else if (fl.type === "checkbox") v = v ? t("misc.yes") : t("misc.no");
    else if (fl.type === "attendees") v = (v || []).map((p) => `${p.name} · ${p.title} · ${t("dr." + p.role)}`).join("\n");
    return `<div><dt class="eyebrow">${esc(L(fl, "label"))}</dt><dd style="margin:2px 0 0;white-space:pre-line">${esc(v) || `<span class="muted">${t("misc.none")}</span>`}</dd></div>`; }).join("")}</dl></div>`).join("");
  return `<div class="page"><div class="page-head"><div><p class="crumbs">${opp(r.opp) ? `<a href="#deal-${r.opp}">${esc(opp(r.opp).name)}</a> › ` : ""}${esc(L(f))}</p><h1>${esc(reqTitle(r))}</h1>
      <p class="lead">${esc(user(r.requester).name)} → ${esc(L(f))}${r.assignee ? ` · ${t("cols.assigned")}: ${esc(user(r.assignee).name)}` : ""}${r0.booking ? ` · ${t("req.scheduled", { d: fmtDate(r0.booking) })}` : ""}</p></div>
      <div class="btn-row">${actions.join("")}</div></div>
    ${flowStrip(r.status)}
    <div class="split"><div class="grid">
      <section class="panel"><header><h2>${t("req.answers")}</h2><span class="muted small">${t("req.template", { t: L(tpl), v: r.version })}</span></header><div class="body form">${answers}</div></section>
      <section class="panel"><header><h2>${t("req.effort")}</h2><span class="btn-row"><span class="muted small num">${t("req.totalHours", { h: total })}</span>${canEffort ? `<button class="btn sm" data-act="log-effort" data-id="${r.id}">＋ ${t("req.logEffort")}</button>` : ""}</span></header>
        ${r.effort.length ? `<div class="table-wrap"><table><thead><tr><th>${t("req.date")}</th><th>${t("cols.name")}</th><th>${t("req.activity")}</th><th class="r">${t("req.hours")}</th></tr></thead><tbody>${r.effort.map((e) => `<tr><td class="num">${fmtDate(e.date)}</td><td>${esc(user(e.user).name)}</td><td>${t("act." + e.activity)}</td><td class="r num">${e.hours}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">${t("req.noEffort")}</p>`}</section>
      <section class="panel"><header><h2>${t("req.outcome")}</h2>${canOutcome ? `<button class="btn sm primary" data-act="outcome" data-id="${r.id}">${t("req.recordOutcome")}</button>` : ""}</header>

    </div>
    <div class="grid"><aside class="panel score" style="position:static">${scorePanel({ ...r.answers, target: r.target, fn: r.fn }, !!r.opp)}</aside>
      <section class="panel"><header><h2>${t("req.timeline")}</h2></header><div class="body"><ul class="timeline">${[...r.events].reverse().map((e) => `<li><span class="dot"></span><div><p>${statusChip(e.to)} <span class="muted small">${t("misc.by", { who: esc(user(e.by).name) })}</span></p><p class="muted small num">${fmtTime(e.at)}</p>${e.note ? `<p class="small" style="margin-top:4px">“${esc(e.note)}”</p>` : ""}</div></li>`).join("")}</ul></div></section></div></div></div>`;

/* ───────────────────────── shell & routing ───────────────────────── */
const ROUTES = {
  home: viewHome, pipeline: viewPipeline, accounts: viewAccounts, requests: viewMyRequests, assignments: viewAssignments, triage: viewTriage, analytics: viewAnalytics,
  "admin-functions": viewFunctions, "admin-templates": viewTemplates, "admin-stages": viewStages, "admin-users": viewUsers, setup: viewSetup,

function parseRoute() {
  const h = (location.hash || "#home").slice(1);
  for (const [p, fnc] of [["request-new-", viewRequestNew], ["request-", viewRequest], ["deal-", viewDeal], ["account-", viewAccount]]) if (h.startsWith(p)) return { name: p.slice(0, -1), view: () => fnc(h.slice(p.length)) };
  if (h === "signin") return { name: "signin" };
  const guard = { triage: ["lead", "admin"], "admin-functions": ["lead", "admin"], "admin-templates": ["lead", "admin"], "admin-stages": ["admin"], "admin-users": ["admin"], setup: ["admin"], assignments: ["specialist", "lead"], requests: ["ae", "manager", "admin"] };
  if (guard[h] && !guard[h].includes(S.role)) return { name: h, view: viewNotFound };
  return { name: ROUTES[h] ? h : "home", view: ROUTES[h] || viewHome };
}
function navItems() {
  const r = S.role, items = [["group", t("nav.work")], ["home", t("nav.home")], ["pipeline", t("nav.pipeline"), visibleOpps().length], ["accounts", t("nav.accounts")]];
  items.push(["group", t("nav.support")]);
  if (["ae", "manager", "admin"].includes(r)) items.push(["requests", t("nav.requests"), S.d.requests.filter((x) => x.requester === me().id && OPEN.includes(x.status)).length]);
  if (["specialist", "lead"].includes(r)) items.push(["assignments", t("nav.assignments"), S.d.requests.filter((x) => x.assignee === me().id && OPEN.includes(x.status)).length]);
  if (["lead", "admin"].includes(r)) { const f = new Set(myFns().map((x) => x.id)); items.push(["triage", t("nav.triage"), S.d.requests.filter((x) => f.has(x.fn) && x.status === "new").length]); }
  items.push(["analytics", `${t("nav.analytics")}`, t("nav.phase2"), true]);
  if (["lead", "admin"].includes(r)) {
    items.push(["group", t("nav.admin")], ["admin-functions", t("nav.functions")], ["admin-templates", t("nav.templates")]);
    if (r === "admin") items.push(["admin-stages", t("nav.stages")], ["admin-users", t("nav.users")], ["setup", t("nav.setup")]);
  }
  return items;
}

function persistDraft(silent) {
  const d = S.draft; if (!d) return;

  if (!r) { r = { id: uid("r"), opp: d.opp, requester: me().id, fn: d.fn, status: "draft", answers, target, events: [{ from: null, to: "draft", by: me().id, at: new Date().toISOString() }], assignee: null, effort: [], outcome: null, version: 1 }; S.d.requests.push(r); d.reqId = r.id; }

  const el = $("#saved-at"); if (el) el.textContent = t("req.draftSaved", { t: d.savedAt });

document.addEventListener("dragover", (e) => { const col = e.target.closest?.(".col"); if (col) { e.preventDefault(); document.querySelectorAll(".col.drop").forEach((x) => x !== col && x.classList.remove("drop")); col.classList.add("drop"); } });
document.addEventListener("dragleave", (e) => { const col = e.target.closest?.(".col"); if (col && !col.contains(e.relatedTarget)) col.classList.remove("drop"); });
document.addEventListener("drop", (e) => { const col = e.target.closest?.(".col"); if (col) { e.preventDefault(); col.classList.remove("drop"); moveDeal(e.dataTransfer.getData("text/plain"), col.dataset.stage); } });

/* CSV import */
function parseCsv(text) {
  const rows = text.split(/\r?\n/).filter((l) => l.trim()).map((l) => { const out = []; let cur = "", q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === "," && !q) { out.push(cur.trim()); cur = ""; } else cur += ch; } out.push(cur.trim()); return out; });
  if (rows.length && rows[0][0].toLowerCase() === "name") rows.shift();
  return rows.map(([name = "", country = "", industry = "", rel = "new_logo"]) => {
    const errors = []; if (!name) errors.push("name"); if (country && !/^[A-Za-z]{2}$/.test(country)) errors.push("country"); if (!["new_logo", "expand", "retain"].includes(rel)) errors.push("relationship");
    return { name, country: country.toUpperCase(), industry, rel, errors };
  });
}
function openImport() {
  const sample = "name,country,industry,relationship\nKestrel Shipping,DK,Logistics,new_logo\nLoire Valley Wines,FR,Food & beverage,expand\nMeridian Clinics,XX1,Healthcare,retain\n,FR,Retail,new_logo";
  openDialog(t("acc.importTitle"), `<p class="muted small">${t("acc.importHint")}</p><input type="file" id="dl-file" accept=".csv,text/csv" aria-label="${t("acc.chooseFile")}"><textarea id="dl-csv" style="font-family:var(--mono);font-size:0.8rem;min-height:110px">${sample}</textarea><div id="dl-prev"></div>`, t("acc.import"), (d) => {
    const ok = parseCsv(d.querySelector("#dl-csv").value).filter((r) => !r.errors.length);
    ok.forEach((r) => S.d.accounts.push({ id: uid("a"), name: r.name, country: r.country, industry: r.industry, rel: r.rel, owner: me().id }));
    toast(t("acc.imported", { n: ok.length })); render();
  });
  const d = $("#dlg"), prev = () => { const rows = parseCsv(d.querySelector("#dl-csv").value), bad = rows.filter((r) => r.errors.length).length;
    d.querySelector("#dl-prev").innerHTML = `<div class="chips"><span class="chip good">${t("acc.rowsOk", { n: rows.length - bad })}</span>${bad ? `<span class="chip bad">${t("acc.rowsBad", { n: bad })}</span>` : ""}</div><div class="table-wrap" style="max-height:180px;margin-top:8px"><table><tbody>${rows.map((r) => `<tr><td>${esc(r.name) || "<em>?</em>"}</td><td>${esc(r.country)}</td><td>${r.errors.length ? `<span class="chip bad">${esc(r.errors.join(", "))}</span>` : `<span class="chip good">✓</span>`}</td></tr>`).join("")}</tbody></table></div>`; };
  d.querySelector("#dl-csv").addEventListener("input", prev);
  d.querySelector("#dl-file").addEventListener("change", (e) => { const f = e.target.files[0]; if (!f) return; const fr = new FileReader(); fr.onload = () => { d.querySelector("#dl-csv").value = fr.result; prev(); }; fr.readAsText(f); });
  prev();
}

window.addEventListener("hashchange", () => { document.body.classList.remove("nav-open"); S.bell = false; render(); window.scrollTo(0, 0); });
render();
</script>

<title>CLEAN Companion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: iOS-style app — translucent nav bar with large titles, inset grouped lists, bottom tab bar on phones; iPad-style floating top tab bar and centred readable column on wide screens. Light mode only, by request. */
:root {
  --bg: #f2f2f7;            /* grouped background */
  --card: #ffffff;          /* secondary grouped background */
  --fill: rgba(118, 118, 128, 0.12);
  --fill-strong: rgba(118, 118, 128, 0.2);
  --label: #000000;
  --label-2: rgba(60, 60, 67, 0.6);
  --label-3: rgba(60, 60, 67, 0.3);
  --sep: rgba(60, 60, 67, 0.18);
  --tint: #007aff;
  --tint-soft: rgba(0, 122, 255, 0.12);
  --green: #34c759; --green-ink: #248a3d; --green-soft: rgba(52, 199, 89, 0.15);
  --orange: #ff9500; --orange-ink: #c93400; --orange-soft: rgba(255, 149, 0, 0.15);
  --red: #ff3b30; --red-ink: #d70015; --red-soft: rgba(255, 59, 48, 0.12);
  --indigo: #5856d6; --teal: #30b0c7; --gray: #8e8e93;
  --bar: rgba(249, 249, 249, 0.82);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 12px;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
body { color: var(--label); font-family: var(--font); font-size: 17px; line-height: 1.3; letter-spacing: -0.01em; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
a { color: var(--tint); text-decoration: none; }
:focus-visible { outline: 3px solid rgba(0, 122, 255, 0.5); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bar); }

/* workspace brand chip (per-organisation branding, D-058: initials, never a copied logo) */
.brandchip { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; padding: 4px 8px; border: 0; background: none; color: var(--label); white-space: nowrap; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
.brandchip .mark { flex: none; width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--brand-ink, var(--fill-strong)); color: var(--brand-ink-fg, var(--label)); border-bottom: 3px solid var(--tint); }
/* prototype ribbon */
.ribbon { font-size: 12px; color: var(--label-2); text-align: center; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* navigation bar */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; height: 52px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  background: transparent; transition: background 0.2s, border-color 0.2s; border-bottom: 0.5px solid transparent; }
.nav.scrolled { background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom-color: var(--sep); }
.nav .title { font-weight: 600; font-size: 17px; opacity: 0; transition: opacity 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52vw; }
.nav.scrolled .title { opacity: 1; }
.nav .l { justify-self: start; display: flex; align-items: center; }
.nav .r { justify-self: end; display: flex; gap: 4px; align-items: center; }
.navbtn { border: 0; background: none; color: var(--tint); display: inline-flex; align-items: center; gap: 2px; padding: 8px; font-size: 17px; border-radius: 10px; }
.navbtn svg { width: 22px; height: 22px; }
.back svg { width: 13px; height: 22px; margin-right: 4px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--tint); color: var(--on-tint, #fff); font-size: 13px; font-weight: 600; display: grid; place-items: center; border: 0; }

/* page */
main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.page { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; }
.large { padding-top: 2px; }
.large h1 { font-family: var(--display); font-size: 34px; font-weight: 700; letter-spacing: 0.01em; margin: 0; line-height: 1.15; text-wrap: balance; }
.large p { color: var(--label-2); font-size: 15px; margin: 4px 0 0; }
.large .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

/* grouped lists */
.group { display: flex; flex-direction: column; gap: 7px; }
.gh { font-size: 13px; text-transform: uppercase; letter-spacing: 0.02em; color: var(--label-2); padding: 0 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.gh a, .gh button { text-transform: none; letter-spacing: 0; font-size: 15px; border: 0; background: none; color: var(--tint); padding: 0; }
.gf { font-size: 13px; color: var(--label-2); padding: 0 16px; line-height: 1.35; }
.list { background: var(--card); border-radius: var(--r); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 10px 16px; position: relative; width: 100%; text-align: left; background: var(--card); border: 0; color: inherit; }
.row + .row::before, .row + .rowwrap::before, .rowwrap + .row::before { content: ""; position: absolute; top: 0; right: 0; left: var(--inset, 16px); border-top: 0.5px solid var(--sep); }
.row.tap:active, button.row:active { background: #e5e5ea; }
.row .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .t { font-size: 17px; }
.row .s { font-size: 14px; color: var(--label-2); line-height: 1.3; }
.row .v { color: var(--label-2); font-size: 16px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.chev { width: 8px; height: 13px; color: var(--label-3); flex: none; }
.ico { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: #fff; flex: none; }
.ico svg { width: 18px; height: 18px; }
.rank { width: 26px; height: 26px; border-radius: 50%; background: var(--fill); color: var(--label-2); font-size: 14px; font-weight: 600; display: grid; place-items: center; flex: none; }
.rank.top { background: var(--tint); color: #fff; }
.with-ico { --inset: 58px; }

/* pills, rings */
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--fill); color: var(--label-2); white-space: nowrap; }
.pill.blue { background: var(--tint-soft); color: var(--tint); }
.pill.green { background: var(--green-soft); color: var(--green-ink); }
.pill.orange { background: var(--orange-soft); color: var(--orange-ink); }
.pill.red { background: var(--red-soft); color: var(--red-ink); }
.ring { --p: 0; --c: var(--green); width: 38px; height: 38px; border-radius: 50%; background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--fill-strong) 0); display: grid; place-items: center; flex: none; border: 0; padding: 0; }
.ring span { width: 30px; height: 30px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--label); }
.ring.lg { width: 64px; height: 64px; }
.ring.lg span { width: 52px; height: 52px; font-size: 20px; }
.dots { display: inline-flex; gap: 2px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--fill-strong); }
.dots i.on { background: var(--tint); }

/* segmented control */
.seg { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { flex: 1 1 0; min-width: 0; border: 0; background: transparent; border-radius: 7px; padding: 6px 8px; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button[aria-pressed="true"] { background: var(--card); font-weight: 600; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 3px 1px rgba(0, 0, 0, 0.04); }
.seg.sm button { padding: 4px 8px; font-size: 13px; }

/* search */
.search { display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 10px; padding: 7px 10px; color: var(--label-2); }
.search svg { width: 16px; height: 16px; flex: none; }
.search input { border: 0; background: transparent; flex: 1; outline: none; min-width: 0; font-size: 17px; }

/* buttons */
.btn { border: 0; border-radius: 12px; padding: 14px 18px; font-weight: 600; font-size: 17px; background: var(--tint); color: #fff; width: 100%; }
.btn.secondary { background: var(--tint-soft); color: var(--tint); }
.btn.plain { background: var(--card); color: var(--tint); }
.btn.danger { background: var(--card); color: var(--red); }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.btn-row { display: flex; gap: 10px; }
.linkbtn { border: 0; background: none; color: var(--tint); padding: 0; font-size: inherit; }

/* toggle */
.switch { position: relative; width: 51px; height: 31px; flex: none; }
.switch input { appearance: none; -webkit-appearance: none; margin: 0; width: 51px; height: 31px; border-radius: 999px; background: var(--fill-strong); transition: background 0.2s; cursor: pointer; }
.switch input:checked { background: var(--green); }
.switch i { position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 3px 1px rgba(0, 0, 0, 0.06); transition: transform 0.2s; pointer-events: none; }
.switch input:checked + i { transform: translateX(20px); }

/* inputs */
.field { width: 100%; border: 0; background: transparent; padding: 12px 16px; font-size: 17px; outline: none; }
textarea.field { min-height: 160px; resize: vertical; line-height: 1.4; }
.inline-input { border: 0; background: var(--fill); border-radius: 8px; padding: 6px 8px; font-size: 15px; width: 100%; }
select.inline-input { width: auto; }

/* week strip */
.strip { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 2px 6px; margin: 0 -2px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.wcard { scroll-snap-align: start; flex: 0 0 164px; background: var(--card); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 6px; border: 0; text-align: left; color: inherit; }
.wcard .d { font-size: 13px; font-weight: 600; color: var(--tint); text-transform: uppercase; letter-spacing: 0.02em; }
.wcard .t { font-size: 15px; font-weight: 600; line-height: 1.25; }
.wcard .s { font-size: 13px; color: var(--label-2); }
.wcard.red .d { color: var(--red-ink); } .wcard.green .d { color: var(--green-ink); }

/* relationship map */
.rmap { display: grid; grid-template-columns: 116px repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--sep); border-radius: var(--r); overflow: hidden; font-size: 13px; }
.rmap > div { background: var(--card); padding: 8px; min-height: 44px; display: flex; flex-direction: column; gap: 4px; }
.rmap .h { font-weight: 600; color: var(--label-2); text-transform: uppercase; font-size: 11px; letter-spacing: 0.03em; justify-content: center; min-height: 32px; }
.rmap .rl { font-weight: 600; font-size: 13px; justify-content: center; }
.person-chip { border: 0; border-radius: 8px; padding: 5px 7px; text-align: left; font-size: 12px; line-height: 1.25; display: flex; flex-direction: column; gap: 2px; background: var(--fill); color: var(--label); }
.person-chip b { font-weight: 600; font-size: 12.5px; }
.person-chip.stale { box-shadow: inset 0 0 0 1.5px var(--orange); }
.st-supporter { background: var(--green-soft); } .st-neutral { background: var(--fill); } .st-sceptic { background: var(--orange-soft); } .st-unknown { background: #fff; box-shadow: inset 0 0 0 1px var(--sep); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--label-2); padding: 0 16px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend b { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* coverage */
.cov { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px; }
.cov .pill { font-weight: 600; }
.cov .missing { background: transparent; color: var(--red-ink); box-shadow: inset 0 0 0 1.5px var(--red); }

/* bars */
.bars { padding: 10px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(96px, 30%) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; }
.bar-row .tr { height: 10px; }
.bar-row .tr i { display: block; height: 100%; background: var(--tint); border-radius: 0 4px 4px 0; min-width: 2px; }
.bar-row .val { color: var(--label-2); white-space: nowrap; }

/* forecast cards */
.fc { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.fc button { background: var(--card); border-radius: var(--r); padding: 12px; border: 0; text-align: left; display: flex; flex-direction: column; gap: 4px; color: inherit; }
.fc .k { font-size: 13px; color: var(--label-2); font-weight: 600; }
.fc .n { font-size: 22px; font-weight: 700; font-family: var(--display); }
.fc .x { font-size: 12px; color: var(--label-2); }

/* whitespace grid */
.ws { overflow-x: auto; }
.ws table { border-collapse: separate; border-spacing: 4px; width: 100%; font-size: 13px; }
.ws th { color: var(--label-2); font-weight: 600; text-align: left; padding: 4px; }
.ws td button { width: 100%; border: 0; border-radius: 8px; padding: 8px 6px; font-size: 12px; font-weight: 600; }
.ws-owned { background: var(--green-soft); color: var(--green-ink); } .ws-in_progress { background: var(--tint-soft); color: var(--tint); } .ws-open { background: var(--orange-soft); color: var(--orange-ink); } .ws-not_relevant { background: var(--fill); color: var(--label-2); }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-top: 0.5px solid var(--sep);
  display: flex; justify-content: space-around; padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tab { border: 0; background: none; color: var(--gray); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; font-weight: 500; min-width: 64px; padding: 2px 4px; position: relative; }
.tab svg { width: 26px; height: 26px; }
.tab.on { color: var(--tint); }
.tab .badge { position: absolute; top: -2px; left: 50%; margin-left: 6px; background: var(--red); color: #fff; font-size: 11px; font-weight: 600; min-width: 18px; height: 18px; border-radius: 999px; display: grid; place-items: center; padding: 0 5px; }
.tab.capture .plus { width: 44px; height: 30px; border-radius: 10px; background: var(--tint); color: #fff; display: grid; place-items: center; }
.tab.capture .plus svg { width: 20px; height: 20px; }

/* sheets */
.backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.32); z-index: 70; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 92vh; overflow: auto; border-radius: 14px 14px 0 0; padding: 8px 0 calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--label-3); margin: 0 auto 6px; }
.sheet .sh { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 4px 8px 10px; }
.sheet .sh h2 { font-size: 17px; font-weight: 600; margin: 0; text-align: center; }
.sheet .sb { display: flex; flex-direction: column; gap: 22px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.actionsheet { width: 100%; max-width: 520px; padding: 0 8px calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
.actionsheet .list { border-radius: 14px; background: rgba(255, 255, 255, 0.94); }
.actionsheet .hd { padding: 14px 16px; text-align: center; font-size: 13px; color: var(--label-2); }
.actionsheet .hd b { display: block; color: var(--label); font-size: 15px; margin-bottom: 4px; }
.actionsheet button.opt { width: 100%; border: 0; background: transparent; color: var(--tint); font-size: 20px; padding: 16px; border-top: 0.5px solid var(--sep); }
.actionsheet button.opt.danger { color: var(--red); }
.actionsheet button.cancel { border-radius: 14px; background: #fff; border: 0; color: var(--tint); font-weight: 600; font-size: 20px; padding: 16px; }
@media (prefers-reduced-motion: no-preference) {
  .sheet, .actionsheet { animation: up 0.28s cubic-bezier(0.2, 0.9, 0.3, 1); }
  .backdrop { animation: fade 0.2s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: 0.4; } to { transform: none; opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
}

/* toast (HUD banner) */
.toast { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 90; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.16); border-radius: 999px; padding: 10px 18px; font-size: 15px; font-weight: 600; max-width: calc(100vw - 32px); text-align: center; }

.reason-list { list-style: none; margin: 0; padding: 0; }
.reason-list li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 10px 16px; font-size: 15px; position: relative; }
.reason-list li + li::before { content: ""; position: absolute; top: 0; left: 46px; right: 0; border-top: 0.5px solid var(--sep); }
.ok { color: var(--green-ink); } .part { color: var(--orange-ink); } .no { color: var(--label-3); }
.quote { font-size: 13px; color: var(--label-2); border-left: 3px solid var(--fill-strong); padding-left: 8px; margin-top: 4px; font-style: italic; }
.empty { padding: 22px 16px; text-align: center; color: var(--label-2); font-size: 15px; }
.note { background: #f3f0ff; color: #3a2c80; border-radius: var(--r); padding: 12px 14px; font-size: 14px; line-height: 1.4; }
.note b { color: #5845c9; }
body.hide-notes .note { display: none; }

@media (min-width: 900px) {
  .tabbar { top: calc(8px + env(safe-area-inset-top, 0px)); bottom: auto; left: 50%; right: auto; transform: translateX(-50%); border-radius: 999px; border: 0.5px solid var(--sep); padding: 4px; gap: 2px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08); }
  .tab { flex-direction: row; gap: 6px; font-size: 14px; padding: 7px 14px; border-radius: 999px; min-width: 0; color: var(--label); }
  .tab svg { width: 18px; height: 18px; }
  .tab.on { background: var(--card); color: var(--tint); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); }
  .tab .badge { position: static; margin: 0; }
  .tab.capture .plus { width: 22px; height: 22px; border-radius: 6px; }
  .tab.capture .plus svg { width: 14px; height: 14px; }
  .nav .title { display: none; }
  .nav .r { grid-column: 3; } /* keep the avatar at the right edge, clear of the floating tab bar */
  .nav { height: 60px; }
  main { padding-bottom: 48px; }
  .backdrop { align-items: center; }
  .toast { top: calc(72px + env(safe-area-inset-top, 0px)); }
  .sheet { border-radius: 14px; max-height: 86vh; }
}
@media (max-width: 520px) {
  .rmap { grid-template-columns: 84px repeat(4, minmax(0, 1fr)); }
  .fc .n { font-size: 18px; }
  .seg button { font-size: 13px; padding: 6px 4px; }
  /* relationship map becomes a list by role on phones; stance is printed on each chip */
  .rmap { grid-template-columns: minmax(0, 1fr); background: var(--card); gap: 0; }
  .rmap .h, .rmap > div[role="cell"]:empty { display: none; }
  .rmap .rl { min-height: 0; padding: 12px 12px 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--label-2); border-top: 0.5px solid var(--sep); }
  .rmap .rl:nth-child(6) { border-top: 0; }
  .rmap > div[role="cell"] { flex-direction: row; flex-wrap: wrap; min-height: 0; padding: 2px 12px 8px; }
  .person-chip .stx { display: inline; }
}
.person-chip .stx { display: none; font-weight: 600; color: var(--label-2); }
</style>

<script>
"use strict";
/* ───────── i18n ───────── */

function toast(msg) { S.toast = msg; let el = $(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.append(el); } el.textContent = msg; clearTimeout(toast.h); toast.h = setTimeout(() => el.remove(), 2600); }

/* ───────── screens ───────── */
function screenToday() {
  const acts = rankActions();
  const week = [
    ...S.d.upcoming.map((m) => ({ at: m.at, kind: "meeting", title: m.title, sub: m.time, href: `brief-${m.id}`, cls: "" })),
    ...S.d.deals.filter((d) => isOpen(d) && diffDays(d.close) >= 0 && diffDays(d.close) <= 14).map((d) => ({ at: d.close, kind: "close", title: d.name, sub: money(d.amount), href: `deal-${d.id}`, cls: "green" })),
    ...S.d.accounts.filter((a) => a.renewal && diffDays(a.renewal) >= 0 && diffDays(a.renewal) <= 45).map((a) => ({ at: a.renewal, kind: "renewal", title: a.name, sub: money(a.annual), href: `account-${a.id}`, cls: "red" })),
  ].sort((a, b) => a.at.localeCompare(b.at));
  return {
    title: t("today.title"), right: `<button class="avatar" data-act="go" data-href="settings" aria-label="${t("set.title")}">${WS().user}</button>`, left: `<button class="brandchip" data-act="go" data-href="settings" aria-label="${esc(t("set.ws"))}: ${esc(WS().name)}"><span class="mark" aria-hidden="true">${WS().initials}</span><span>${esc(WS().name)}</span></button>`,
    body: `<div class="large"><h1>${t("today.title")}</h1><p>${fmtDate(TODAY_ISO, { weekday: "long", day: "numeric", month: "long" })}</p></div>
    ${S.ws === "meca" ? note("meca") : note("ios")}
    <section class="group"><h2 class="gh"><span>${t("today.week")}</span></h2><div class="strip">${week.map((w) => `<a class="wcard ${w.cls}" href="#${w.href}"><span class="d">${rel(w.at)} · ${t("wk." + w.kind)}</span><span class="t">${esc(w.title)}</span><span class="s num">${esc(w.sub)}</span></a>`).join("")}</div></section>
    ${group(t("today.focus"), acts.length ? acts.map((a, i) => row({ act: "action", data: `data-key="${a.key}"`, lead: `<span class="rank ${i === 0 ? "top" : ""} num">${i + 1}</span>`, title: esc(a.title), sub: esc(a.reason), value: `<span class="pill num">${a.score}</span>` })).join("") : `<p class="empty">${t("today.empty")}</p>`, t("today.footer"))}
    ${note("today")}`,

}

function relationshipMap(people) {
  const stances = ["supporter", "neutral", "sceptic", "unknown"];
  const roles = MAP_ROLES.filter((r) => people.some((p) => p.role === r) || REQUIRED_ROLES.includes(r));
  return `<div class="rmap" role="table"><div class="h" role="columnheader"></div>${stances.map((s) => `<div class="h" role="columnheader">${t("stance." + s)}</div>`).join("")}
    ${roles.map((r) => `<div class="rl" role="rowheader" title="${esc(t("roleHelp." + r))}">${t("role." + r)}</div>${stances.map((s) => `<div role="cell">${people.filter((p) => p.role === r && p.stance === s).map((p) => `<button class="person-chip st-${s} ${!engaged(p) ? "stale" : ""}" data-act="person" data-id="${p.id}" title="${esc(p.title)}"><b>${esc(p.name)}</b><span class="stx">${t("stance." + s)}</span>${dots(p.strength)}<span style="color:var(--label-2)">${p.last ? t("deal.ago", { n: ago(p.last) }) : t("deal.never")}</span></button>`).join("")}</div>`).join("")}`).join("")}</div>
    <div class="legend"><span><b class="st-supporter"></b>${t("stance.supporter")}</span><span><b class="st-neutral"></b>${t("stance.neutral")}</span><span><b class="st-sceptic"></b>${t("stance.sceptic")}</span><span><b class="st-unknown"></b>${t("stance.unknown")}</span></div>`;
}
const coverageHtml = (cov) => `<div class="cov">${cov.map((c) => `<span class="pill ${c.status === "filled" ? "green" : c.status === "weak" ? "orange" : "missing"}" title="${esc(t("roleHelp." + c.role))}">${c.status === "filled" ? "✓" : c.status === "weak" ? "!" : "○"} ${t("role." + c.role)} · ${t("cov." + c.status)}</span>`).join("")}</div>`;

function screenAccount(id) {

    ${group(t("acc.health"), `<div class="row">${ring(h, true, `health-account" data-id="${id}`)}<span class="main"><span class="t">${bandPill(h.band)}</span><span class="s">${h.reasons.filter((r) => r.pts < r.max).map((r) => t("hr." + r.k)).join(" · ") || t("band.healthy")}</span></span></div>`)}
    ${na ? group(t("acc.next"), row({ href: na.go, ico: "bolt", icoBg: "var(--orange)", title: esc(na.title), sub: esc(na.reason) })) : ""}
    ${plan || a.tier === "key" ? group(t("acc.plan"), row({ href: `plan-${id}`, ico: "doc", icoBg: "var(--indigo)", title: t("acc.openPlan"), sub: plan ? t("acc.planReviewed", { n: ago(plan.reviewed) }) : t("none") })) : ""}
    ${group(t("acc.signals"), sig.length ? sig.map((g) => row({ ico: "wave", icoBg: "var(--teal)", title: esc(L(g, "title")), sub: rel(g.at), chev: false })).join("") : `<p class="empty">${t("acc.noSignals")}</p>`)}
    ${group(t("acc.details"), [[t("acc.relationship"), a.relationship === "customer" ? t("acc.customer") : t("acc.prospect")], [t("acc.tier"), t("acc." + a.tier)], [t("acc.segment"), a.segment], [t("acc.industry"), a.industry], [t("acc.country"), a.country], [t("acc.annual"), a.annual ? money(a.annual) : t("none")], [t("acc.renewal"), a.renewal ? fmtDate(a.renewal, { day: "numeric", month: "long", year: "numeric" }) : t("none")]].map(([k, v]) => row({ title: k, value: esc(v), chev: false })).join(""))}`;
  if (segv === "people") content = `${group(t("acc.coverage"), coverageHtml(h.cov))}<section class="group"><h2 class="gh"><span>${t("acc.map")}</span></h2>${relationshipMap(ps)}<p class="gf">${t("acc.mapFoot")}</p></section>
    ${group(t("acc.people"), ps.map((p) => row({ act: "person", data: `data-id="${p.id}"`, title: esc(p.name), sub: `${esc(p.title)} · ${t("role." + p.role)}`, value: dots(p.strength) })).join(""))}`;
  if (segv === "deals") content = group("", ds.length ? ds.map((d) => { const dh = assessDeal(d); return row({ href: `deal-${d.id}`, lead: isOpen(d) ? ring(dh) : "", title: esc(d.name), sub: `${L(stage(d.stage))} · ${money(d.amount)} · ${fmtDate(d.close)}` }); }).join("") : `<p class="empty">${t("acc.noDeals")}</p>`);
  if (segv === "timeline") content = group("", S.d.interactions.filter((i) => i.account === id).sort((x, y) => y.at.localeCompare(x.at)).map((i) => row({ ico: i.type === "meeting" ? "people" : i.type === "call" ? "wave" : i.type === "event" ? "flag" : "doc", icoBg: i.type === "meeting" ? "var(--tint)" : i.type === "call" ? "var(--green)" : "var(--gray)", title: esc(i.summary), sub: `${fmtDate(i.at, { day: "numeric", month: "short", year: "numeric" })} · ${i.people.map((pid) => per(pid).name).join(", ")}`, chev: false })).join("") || `<p class="empty">${t("brief.none")}</p>`);
  return {
    title: a.name, back: ["accounts", t("acc.title")],

function screenDeals() {
  const open = S.d.deals.filter(isOpen), closed = S.d.deals.filter((d) => !isOpen(d));
  const rowOf = (d) => { const h = assessDeal(d); return row({ href: `deal-${d.id}`, lead: isOpen(d) ? ring(h) : "", title: esc(d.name), sub: `${esc(acc(d.account).name)} · ${money(d.amount)} · ${fmtDate(d.close)}`, value: isOpen(d) ? fcPill(d.forecast) : "" }); };
  const body = S.dealView === "board"
    ? STAGES.filter((s) => !s.won && !s.lost).map((s) => { const xs = open.filter((d) => d.stage === s.id); return xs.length ? group(`${L(s)} · ${money(sum(xs, (d) => d.amount))}`, xs.map(rowOf).join("")) : ""; }).join("") + group(t("deal.closedDeals"), closed.map(rowOf).join(""))
    : group(t("deal.openDeals"), open.sort((a, b) => a.close.localeCompare(b.close)).map(rowOf).join("")) + group(t("deal.closedDeals"), closed.map(rowOf).join(""));
  return { title: t("deal.title"), body: `<div class="large"><h1>${t("deal.title")}</h1></div>${seg("dealView", [["board", t("deal.board")], ["list", t("deal.list")]], S.dealView)}${body}` };
}

function screenDeal(id) {
  const d = deal(id); if (!d) return screenNotFound();
  const a = acc(d.account), h = assessDeal(d), segv = S.tabSeg[`d:${id}`] || "overview", st = stage(d.stage);
  let content = "";
  if (segv === "overview") content = `
    ${group(t("deal.health"), `<div class="row">${ring(h, true, `health-deal" data-id="${id}`)}<span class="main"><span class="t">${bandPill(h.band)}</span><span class="s">${t("act.why")}: ${h.reasons.filter((r) => r.pts < r.max).map((r) => t("hr." + r.k)).join(" · ") || "—"}</span></span></div>${reasonsList(h.reasons)}`)}
    ${group(t("deal.nextStep"), `<div class="row" style="flex-wrap:wrap"><input class="inline-input" id="next-text" value="${esc(d.next)}" placeholder="${t("deal.noNext")}" aria-label="${t("deal.nextStep")}"><input class="inline-input" type="date" id="next-date" value="${d.nextDate || ""}" style="width:auto" aria-label="${t("deal.due", { d: "" })}"><button class="btn secondary" style="width:auto;padding:8px 14px;font-size:15px" data-act="save-next" data-id="${id}">${t("save")}</button></div>`, d.nextDate && d.nextDate < TODAY_ISO ? `<span style="color:var(--red-ink)">${t("act.r_nextStepPassed", { d: rel(d.nextDate) })}</span>` : "")}
    ${group(t("acc.details"), [[t("deal.amount"), money(d.amount)], [t("deal.stage"), L(st)], [t("deal.close"), fmtDate(d.close, { day: "numeric", month: "long", year: "numeric" })], [t("deal.forecast"), fcPill(d.forecast)], [t("deal.compelling"), esc(d.compelling) || t("none")], ["", d.pushes ? t("deal.pushed", { n: d.pushes }) : t("deal.noPushed")]].map(([k, v]) => row({ title: k || `<span style="color:var(--label-2)">${v}</span>`, value: k ? v : "", chev: false })).join(""))}
    ${group("", row({ ico: "people", icoBg: "var(--gray)", title: t("deal.help"), value: `<span class="pill">${t("deal.flagOff")}</span>`, chev: false, cls: "" }), t("deal.helpFoot"))}`;
  if (segv === "stakeholders") content = `${group(t("acc.coverage"), coverageHtml(coverage(d.stakeholders.map((s) => ({ ...per(s.p), role: s.r })))))}
    ${group(t("deal.stakeholders"), d.stakeholders.map((s) => { const p = per(s.p); return row({ act: "person", data: `data-id="${p.id}"`, title: esc(p.name), sub: `${t("role." + s.r)} · ${t("stance." + p.stance)} · ${p.last ? t("deal.lastTouch", { n: ago(p.last) }) : t("deal.never")}`, value: `${engaged(p) ? `<span class="pill green">${t("deal.engaged")}</span>` : `<span class="pill orange">${t("deal.notEngaged")}</span>`}` }); }).join(""), t("deal.stakeFoot"))}`;
  if (segv === "qual") content = group(t("deal.qual"), CRITERIA.map((c) => { const q = d.qual[c], s = { u: "unknown", p: "partial", c: "confirmed" }[q.s] || q.s; return `<div class="row" style="flex-direction:column;align-items:stretch;gap:8px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><span class="main"><span class="t" title="${esc(t("critHelp." + c))}">${t("crit." + c)}</span><span class="s">${t("critHelp." + c)}</span></span></div>
      <div class="seg sm" role="group" aria-label="${t("crit." + c)}">${["u", "p", "c"].map((v) => `<button data-act="qual" data-id="${id}" data-c="${c}" data-v="${v}" aria-pressed="${q.s === v}">${t("q." + { u: "unknown", p: "partial", c: "confirmed" }[v])}</button>`).join("")}</div>
      <span class="s" style="font-size:14px;color:var(--label-2)">${q.ev ? `<span class="quote">${esc(q.ev)}</span>` : t("deal.noEvidence")}</span></div>`; }).join(""), t("deal.qualFoot"));
  if (segv === "plan") content = `${group(t("deal.plan"), d.steps.map((s) => `<label class="row" style="cursor:pointer"><span class="main"><span class="t" style="${s.done ? "text-decoration:line-through;color:var(--label-2)" : ""}">${esc(s.title)}</span><span class="s">${s.owner === "buyer" ? t("deal.buyer") : t("deal.us")} · ${fmtDate(s.due)}${!s.done && s.due < TODAY_ISO ? ` · <span style="color:var(--red-ink)">${t("deal.ago", { n: ago(s.due) })}</span>` : ""}</span></span><span class="switch"><input type="checkbox" data-act="step" data-id="${id}" data-step="${s.id}" ${s.done ? "checked" : ""} aria-label="${esc(s.title)}"><i></i></span></label>`).join("") || `<p class="empty">${t("none")}</p>`)}

  return {
    title: d.name, back: ["deals", t("deal.title")],
    body: `<div class="large"><h1>${esc(d.name)}</h1><p><a href="#account-${a.id}">${esc(a.name)}</a> · ${money(d.amount)}</p><div class="meta"><span class="pill">${L(st)}</span>${fcPill(d.forecast)}<span class="pill">${t("deal.close")} ${fmtDate(d.close)}</span></div></div>
    ${seg(`d:${id}`, [["overview", t("deal.overview")], ["stakeholders", t("deal.stakeholders")], ["qual", t("deal.qual")], ["plan", t("deal.plan")]], segv)}${content}`,

function quarterRange(offset) { const q = Math.floor(TODAY.getMonth() / 3) + offset; const start = new Date(TODAY.getFullYear(), q * 3, 1, 12), end = new Date(TODAY.getFullYear(), q * 3 + 3, 0, 12); return [iso(start), iso(end), `Q${((q % 4) + 4) % 4 + 1} ${start.getFullYear()}`]; }
function screenPipeline() {
  const [from, to, label] = quarterRange(S.period === "q0" ? 0 : 1);
  const inP = S.d.deals.filter((d) => isOpen(d) && d.close >= from && d.close <= to);
  const commit = inP.filter((d) => d.forecast === "commit"), best = inP.filter((d) => ["commit", "best_case"].includes(d.forecast));
  const open = S.d.deals.filter(isOpen), max = Math.max(1, ...STAGES.map((s) => sum(open.filter((d) => d.stage === s.id), (d) => d.amount)));
  const ch = S.d.events.filter((e) => ago(e.at) <= 7).sort((a, b) => b.at.localeCompare(a.at));
  const chText = (e) => e.kind === "stage" ? t("pipe.chStage", { a: L(stage(e.from)), b: L(stage(e.to)) }) : e.kind === "close" ? t("pipe.chClose", { d: fmtDate(e.to) }) : e.kind === "amount" ? t("pipe.chAmount", { a: money(e.from), b: money(e.to) }) : t("pipe.chForecast", { a: t("fc." + e.from), b: t("fc." + e.to) });
  return {
    title: t("pipe.title"),
    body: `<div class="large"><h1>${t("pipe.title")}</h1><p>${label}</p></div>
    ${seg("period", [["q0", t("pipe.quarter")], ["q1", t("pipe.next")]], S.period)}
    <div class="fc">${[["commit", commit, t("pipe.commitLead")], ["best_case", best, t("pipe.bestLead")], ["pipeline", inP, t("pipe.pipeLead")]].map(([k, xs, lead]) => `<button tabindex="-1"><span class="k">${t("fc." + k)}</span><span class="n num">${money(sum(xs, (d) => d.amount))}</span><span class="x">${t("pipe.count", { n: xs.length })} · ${lead}</span></button>`).join("")}</div>
    ${group(t("pipe.deals"), inP.length ? inP.sort((a, b) => a.close.localeCompare(b.close)).map((d) => { const h = assessDeal(d); return row({ href: `deal-${d.id}`, lead: ring(h), title: esc(d.name), sub: `${money(d.amount)} · ${fmtDate(d.close)} · ${h.reasons.filter((r) => r.pts === 0).map((r) => t("hr." + r.k)).slice(0, 2).join(", ") || t("band." + h.band)}`, value: fcPill(d.forecast) }); }).join("") : `<p class="empty">${t("pipe.noDeals")}</p>`)}
    ${group(t("pipe.byStage"), `<div class="bars">${STAGES.filter((s) => !s.won && !s.lost).map((s) => { const xs = open.filter((d) => d.stage === s.id), v = sum(xs, (d) => d.amount); return `<div class="bar-row" title="${esc(L(s))}: ${money(v)} · ${xs.length}"><span>${esc(L(s))}</span><span class="tr"><i style="width:${(v / max) * 100}%"></i></span><span class="val num">${money(v)} · ${xs.length}</span></div>`; }).join("")}</div>`)}
    ${group(t("pipe.changes"), ch.length ? ch.map((e) => row({ href: `deal-${e.deal}`, title: esc(deal(e.deal).name), sub: `${esc(chText(e))} · ${rel(e.at)}` })).join("") : `<p class="empty">${t("pipe.noChanges")}</p>`)}`,
  };
}

function screenBrief(id) {
  const m = S.d.upcoming.find((x) => x.id === id); if (!m) return screenNotFound();
  if (!m.viewed) { m.viewed = true; }
  const d = m.deal && deal(m.deal), a = acc(m.account), h = d && assessDeal(d);
  const unknown = d ? CRITERIA.filter((c) => d.qual[c].s === "u") : [];
  const missingRoles = d ? coverage(d.stakeholders.map((s) => ({ ...per(s.p), role: s.r }))).filter((c) => c.status === "missing") : [];
  const last = S.d.interactions.filter((i) => i.account === a.id).sort((x, y) => y.at.localeCompare(x.at))[0];
  const sig = S.d.signals.filter((g) => g.account === a.id && ago(g.at) <= 30);
  return {
    title: t("brief.title"), back: ["today", t("today.title")],
    body: `<div class="large"><h1>${esc(m.title)}</h1><p>${rel(m.at)} · ${m.time}</p></div>
    ${group(t("brief.attendees"), m.people.map((pid) => { const p = per(pid); return row({ act: "person", data: `data-id="${p.id}"`, title: esc(p.name), sub: `${esc(p.title)} · ${t("role." + p.role)} · ${t("stance." + p.stance)}`, value: p.last ? t("deal.ago", { n: ago(p.last) }) : t("deal.never") }); }).join(""))}
    ${d ? group(t("brief.deal"), `${row({ href: `deal-${d.id}`, lead: ring(h), title: esc(d.name), sub: `${L(stage(d.stage))} · ${money(d.amount)} · ${t("deal.close")} ${fmtDate(d.close)}` })}${row({ title: t("deal.nextStep"), sub: esc(d.next || t("deal.noNext")), chev: false })}`) : ""}
    ${unknown.length ? group(t("brief.unknowns"), unknown.map((c) => row({ title: t("crit." + c), sub: t("critHelp." + c), chev: false })).join("")) : ""}
    ${group(t("brief.questions"), [...unknown.slice(0, 4).map((c) => t("qs." + c)), ...missingRoles.slice(0, 2).map((c) => t("qs.missingRole", { role: t("role." + c.role).toLowerCase() }))].map((q) => row({ title: esc(q), chev: false })).join("") || `<p class="empty">${t("today.empty")}</p>`)}
    ${group(t("brief.signals"), sig.length ? sig.map((g) => row({ title: esc(L(g, "title")), sub: rel(g.at), chev: false })).join("") : `<p class="empty">${t("acc.noSignals")}</p>`)}
    ${group(t("brief.commitments"), last ? row({ title: esc(last.summary), sub: `${t("brief.lastI")} · ${fmtDate(last.at)}`, chev: false }) : `<p class="empty">${t("brief.none")}</p>`)}
    <button class="btn secondary" disabled>${t("brief.polish")}</button><p class="gf">${t("brief.polishOff")}</p>`,

/* ───────── shell & routing ───────── */
const TABS = [["today", "today"], ["accounts", "accounts"], ["capture", "plus"], ["deals", "deals"], ["pipeline", "pipeline"]];
function route() {
  const h = (location.hash || "#today").slice(1);
  for (const [pre, fn] of [["account-", screenAccount], ["deal-", screenDeal], ["brief-", screenBrief], ["plan-", screenPlan]]) if (h.startsWith(pre)) return { tab: { account: "accounts", deal: "deals", brief: "today", plan: "accounts" }[pre.slice(0, -1)], screen: fn(h.slice(pre.length)) };
  const map = { today: screenToday, accounts: screenAccounts, deals: screenDeals, pipeline: screenPipeline, capture: screenCapture, review: screenReview, settings: screenSettings };
  const key = map[h] ? h : "today";
  return { tab: key === "review" ? "capture" : key === "settings" ? "today" : key, screen: map[key]() };
}
function render() {
  document.documentElement.lang = S.lang;
  const { tab, screen } = route();
  const pend = S.d.proposals.filter((p) => p.status === "pending").length, todayN = rankActions().length;
  const back = screen.back ? `<a class="navbtn back" href="#${screen.back[0]}">${IC.back}<span>${esc(screen.back[1])}</span></a>` : "";
  $("#app").innerHTML = `<p class="ribbon">${t("ribbon")}</p>
    <header class="nav"><span class="l">${back || screen.left || ""}</span><span class="title">${esc(screen.title)}</span><span class="r">${screen.right || ""}</span></header>
    <main id="main"><div class="page">${screen.body}</div></main>
    <nav class="tabbar" aria-label="CLEAN">${TABS.map(([k, ic]) => `<a class="tab ${k === "capture" ? "capture" : ""} ${tab === k ? "on" : ""}" href="#${k}" ${tab === k ? 'aria-current="page"' : ""}>${k === "capture" ? `<span class="plus">${IC.plus}</span>` : IC[ic]}<span>${t("tabs." + k)}</span>${k === "today" && todayN ? `<span class="badge num">${todayN}</span>` : ""}${k === "capture" && pend ? `<span class="badge num">${pend}</span>` : ""}</a>`).join("")}</nav>`;
  onScroll();
}
function onScroll() { $(".nav")?.classList.toggle("scrolled", window.scrollY > 36); }
window.addEventListener("scroll", onScroll, { passive: true });
window.addEventListener("hashchange", () => { closeSheet(); render(); window.scrollTo(0, 0); });

/* ───────── events ───────── */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.closest("[data-stop]") && el.dataset.act === "close-sheet" && el.classList.contains("backdrop")) return;
  if (el.classList.contains("backdrop") && e.target !== el) return;
  const act = el.dataset.act, key = el.dataset.key, id = el.dataset.id;
  const finish = (msg) => { closeSheet(); if (msg) toast(msg); render(); };
  const c = key && candidates().find((x) => x.key === key);
  switch (act) {
    case "close-sheet": closeSheet(); break;
    case "go": location.hash = el.dataset.href; break;
    case "seg": {
      const k = el.dataset.k, v = el.dataset.v;
      if (k === "lang") { S.lang = v; store("cc.lang", v); }
      else if (k === "ws") { if (v !== S.ws) applyWorkspace(v, true); }
      else if (k === "accFilter") S.accFilter = v; else if (k === "dealView") S.dealView = v; else if (k === "period") S.period = v; else if (k === "capMode") { S.capture.text = $("#cap-text")?.value ?? S.capture.text; S.capture.mode = v; }
      else S.tabSeg[k] = v;
      render(); break;
    }
    case "action": actionSheet(key); break;
    case "do": if (c) { S.act[key] = { status: "done", fp: c.fp }; closeSheet(); location.hash = c.go; if (c.seg) { S.tabSeg[`${c.go.startsWith("deal") ? "d" : "a"}:${c.go.split("-")[1]}`] = c.seg; } render(); } break;
    case "snooze-menu": openActionSheet(`<b>${t("act.snoozeT")}</b>${esc(c.title)}`, [{ label: t("act.tomorrow"), act: "snooze", data: `data-key="${key}" data-n="1"` }, { label: t("act.in3"), act: "snooze", data: `data-key="${key}" data-n="3"` }, { label: t("act.nextWeek"), act: "snooze", data: `data-key="${key}" data-n="7"` }]); break;
    case "snooze": S.act[key] = { status: "snoozed", fp: c.fp, until: addDays(+el.dataset.n) }; finish(t("act.snoozed")); break;
    case "dismiss": S.act[key] = { status: "dismissed", fp: c.fp }; finish(t("act.dismissed")); break;
    case "teach": S.teach[c.rule] = Math.max(0.4, +((S.teach[c.rule] ?? 1) * 0.8).toFixed(2)); S.act[key] = { status: "dismissed", fp: c.fp }; finish(t("act.taught")); break;
    case "person": personSheet(id); break;
    case "health-deal": healthSheet("deal", id); break;
    case "health-account": healthSheet("account", id); break;
    case "qual": { const d = deal(id); d.qual[el.dataset.c].s = el.dataset.v; render(); break; }
    case "save-next": { const d = deal(id); d.next = $("#next-text").value.trim(); d.nextDate = $("#next-date").value || null; toast(t("save")); render(); break; }
    case "add-step": { const ti = $("#step-title").value.trim(); if (!ti) break; deal(id).steps.push({ id: uid("cs"), title: ti, owner: $("#step-owner").value, due: $("#step-due").value || addDays(7), done: false }); render(); break; }
    case "review-plan": S.d.plans[id].reviewed = TODAY_ISO; toast(t("plan.reviewedNow")); render(); break;
    case "ws": { const order = ["owned", "in_progress", "open", "not_relevant"], plan = S.d.plans[id], cur = plan.ws[el.dataset.bu][el.dataset.p] || "open"; plan.ws[el.dataset.bu][el.dataset.p] = order[(order.indexOf(cur) + 1) % order.length]; render(); break; }
    case "add-risk": { const v = $("#risk-text").value.trim(); if (v) { S.d.plans[id].risks.push(v); render(); } break; }
    case "rm-risk": S.d.plans[id].risks.splice(+el.dataset.i, 1); render(); break;
    case "sample": S.capture.text = (WS().samples || SAMPLES)[el.dataset.s][S.lang]; S.capture.mode = "paste"; S.capture.account = ""; render(); break;
    case "find": {
      S.capture.text = $("#cap-text").value; S.capture.account = $("#cap-account").value;
      const res = extract(S.capture.text, S.capture.account);
      if (!res.proposals.length) { toast(t("cap.nothing")); break; }
      S.d.proposals = S.d.proposals.filter((p) => p.status !== "pending").concat(res.proposals);
      S.cap = { account: res.account, deal: res.deal, before: res.deal ? assessDeal(deal(res.deal)).score : null };
      location.hash = "review"; break;
    }
    case "approve": {
      const pend = S.d.proposals.filter((p) => p.status === "pending"), n = applyProposals(pend);
      const after = S.cap?.deal ? assessDeal(deal(S.cap.deal)).score : null;
      S.capture.text = "";
      toast(`${t("cap.applied", { n })}${after != null ? ` · ${t("cap.healthChange", { a: S.cap.before, b: after })}` : ""}`);
      location.hash = S.cap?.deal ? `deal-${S.cap.deal}` : "today"; break;
    }
    case "reject-all": S.d.proposals.filter((p) => p.status === "pending").forEach((p) => (p.status = "rejected")); location.hash = "capture"; break;
    case "w": S.weights[el.dataset.k] = Math.max(0, S.weights[el.dataset.k] + +el.dataset.d); render(); break;
    case "reset-teach": S.teach = {}; render(); break;
    case "reset-demo": S.d = WS().seed(); S.act = {}; S.teach = {}; S.weights = { ...DEFAULT_WEIGHTS }; toast(t("set.resetDemo")); location.hash = "today"; render(); break;
  }
});
document.addEventListener("change", (e) => {
  const el = e.target, act = el.dataset.act;
  if (act === "step") { const s = deal(el.dataset.id).steps.find((x) => x.id === el.dataset.step); s.done = el.checked; render(); }
  else if (act === "prop-on") { const p = S.d.proposals.find((x) => x.id === el.dataset.id); p.on = el.checked; const btn = $('[data-act="approve"]'); if (btn) btn.textContent = t("cap.approve", { n: S.d.proposals.filter((x) => x.status === "pending" && x.on).length }); }
  else if (act === "notes") document.body.classList.toggle("hide-notes", !el.checked);
  else if (el.dataset.prop) { const p = S.d.proposals.find((x) => x.id === el.dataset.prop); p[el.dataset.k] = el.value; }
  else if (el.id === "cap-account") S.capture.account = el.value;
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "acc-search") { S.accQuery = el.value; const pos = el.selectionStart; render(); const n = $("#acc-search"); n.focus(); n.setSelectionRange(pos, pos); }
  else if (el.id === "cap-text") { S.capture.text = el.value; const b = $('[data-act="find"]'); if (b) b.disabled = !el.value.trim(); }
  else if (el.dataset.plan) S.d.plans[el.dataset.plan][el.dataset.k] = el.value;
  else if (el.dataset.prop) { const p = S.d.proposals.find((x) => x.id === el.dataset.prop); p[el.dataset.k] = el.value; }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#overlay").innerHTML) closeSheet(); });

render();
</script>

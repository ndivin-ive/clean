  return `<fieldset class="qline" aria-label="${esc(t("qt.lines"))} ${i + 1}"><div class="qline-top"><select data-ql="${i}" data-k="cat" aria-label="${t("qt.product")}"><option value="">${t("qt.free")}</option>${cat.map((c, j) => `<option value="${j}">${esc(c[S.lang === "fr" ? 1 : 0])}</option>`).join("")}</select>
    <input type="text" data-ql="${i}" data-k="desc" value="${esc(l.desc)}" placeholder="${esc(t("qt.desc"))}" aria-label="${esc(t("qt.desc"))}" aria-invalid="${!l.desc.trim()}"></div>
    <div class="qline-grid">${[["qty", t("qt.qty")], ["unit", t("qt.unit")], ["price", t("qt.price")], ["disc", t("qt.disc")], ["vat", t("qt.vat")]].map(([k, lab]) => `<label><span>${lab}</span><input type="${k === "unit" ? "text" : "number"}" step="any" data-ql="${i}" data-k="${k}" value="${esc(l[k])}"></label>`).join("")}
      <div class="qline-total"><span>${t("qt.lineTotal")}</span><b class="num" id="qlt-${i}">${lineOk(l) ? qmoney(lineAmt(l).net) : "—"}</b></div></div>
    <button type="button" class="btn sm ghost danger" data-act="quote-rm-line" data-i="${i}">${esc(t("qt.rmLine", { n: i + 1 }))}</button></fieldset>`;
}
function totalsHtml(q) {
  const tt = qTotals(q.lines);
  return `<dl class="qdoc-totals"><div><dt>${t("qt.subtotal")}</dt><dd class="num">${qmoney(tt.sub)}</dd></div>${tt.disc ? `<div class="muted"><dt>${t("qt.discounts")}</dt><dd class="num">${qmoney(tt.disc)}</dd></div>` : ""}${tt.byRate.map((v) => `<div><dt>${esc(t("qt.vatLine", { rate: qnum(v.rate) }))}</dt><dd class="num">${qmoney(v.vat)}</dd></div>`).join("")}<div class="grand"><dt>${t("qt.total")}</dt><dd class="num">${qmoney(tt.total)}</dd></div></dl>`;
}
function viewQuote(id) {
  const q = quote(id); if (!q || !visibleQuotes().includes(q)) return viewNotFound();
  const o = opp(q.opp), a = account(o.account), st = qStatus(q), mine = canEditQuote(q), ref = qRef(q);
  const head = `<div class="page-head"><div><p class="crumbs"><a href="#quotes">${t("qt.title")}</a> › <a href="#deal-${o.id}">${esc(o.name)}</a></p><h1>${ref ? esc(t("qt.ref", { ref })) : t("qt.draft")}</h1><div class="chips" style="margin-top:6px">${qPill(st)}<span class="chip">${esc(a.name)}</span></div></div></div>`;
  if (q.status === "draft" && mine) {
    const probs = S.qProblems || []; S.qProblems = null;
    return `<div class="page" style="max-width:980px">${head}${probs.length ? `<div class="flag" role="alert">${probs.map((p) => `<p>${esc(t("qt.p." + p))}</p>`).join("")}</div>` : ""}
      <section class="panel"><header><h2>${t("qt.header")}</h2></header><div class="body form"><div class="fields-2">
        <div class="field"><label for="qf-title" class="req">${t("qt.titleF")}</label><input type="text" id="qf-title" data-qf="title" value="${esc(q.title)}"></div>
        <div class="field"><label for="qf-valid" class="req">${t("qt.validUntil")}</label><input type="date" id="qf-valid" data-qf="validUntil" value="${q.validUntil}"></div>
        <div class="field"><label for="qf-rn">${t("qt.recipient")} · ${t("qt.rName")}</label><input type="text" id="qf-rn" data-qf="recipient" value="${esc(q.recipient)}"></div>
        <div class="field"><label for="qf-re">${t("qt.recipient")} · ${t("qt.rEmail")}</label><input type="email" id="qf-re" data-qf="recipientEmail" value="${esc(q.recipientEmail)}"></div></div>
        <div class="field"><label for="qf-intro">${t("qt.intro")}</label><textarea id="qf-intro" data-qf="intro">${esc(q.intro)}</textarea></div></div></section>
      <section class="panel"><header><h2>${t("qt.lines")}</h2><button class="btn sm" data-act="quote-add-line">＋ ${t("qt.addLine")}</button></header><div class="body qlines">${q.lines.map(editorLine).join("")}</div>
        <div class="body" id="qt-totals" aria-live="polite">${totalsHtml(q)}</div></section>
      <section class="panel"><header><h2>${t("qt.terms")}</h2></header><div class="body"><textarea data-qf="terms" aria-label="${t("qt.terms")}" style="min-height:110px">${esc(q.terms)}</textarea></div></section>
      <section class="panel"><div class="body form">${q.recipientEmail ? `<label class="checks"><label><input type="checkbox" id="qf-email" checked> ${esc(t("qt.emailToo", { email: q.recipientEmail }))}</label></label>` : ""}
        <div class="btn-row"><button class="btn primary" data-act="quote-send">${t("qt.send")}</button><button class="btn" data-act="quote-save">${t("qt.save")}</button><span class="spacer" style="flex:1"></span><button class="btn danger" data-act="quote-del">${t("qt.del")}</button></div><p class="muted small">${t("qt.sendHelp")}</p></div></section></div>`;
  }
  const newer = (S.d.quotes || []).find((x) => x.number && x.number === q.number && x.revision > q.revision);
  const link = q.token ? `${location.href.split("#")[0]}#q-${q.token}` : "";
  const won = stage(o.stage).won;
  return `<div class="page" style="max-width:980px">${head}${mine ? "" : `<div class="note">${esc(t("qt.readOnly", { n: user(q.owner).name }))}</div>`}
    <div class="grid cols-2"><section class="panel"><header><h2>${t("qt.follow")}</h2></header><div class="next">
      <div class="item"><span class="sev ${q.viewedAt ? "good" : ""}"></span><span>${q.viewedAt ? esc(t("qt.viewed", { d: fmtDate(q.viewedAt) })) : t("qt.notViewed")}</span><span></span></div>
      ${q.respondedAt && q.responder ? `<div class="item"><span class="sev ${q.status === "declined" ? "bad" : "good"}"></span><span>${esc(t(q.status === "declined" ? "qt.declinedBy" : "qt.acceptedBy", { n: q.responder.name, d: fmtDate(q.respondedAt) }))}${q.reason ? `<br><span class="muted small">${esc(t("qt.reason", { r: q.reason }))}</span>` : ""}</span><span></span></div>` : ""}
      ${newer ? `<a class="item" href="#quote-${newer.id}"><span class="sev"></span><span>${esc(t("qt.newer", { v: newer.revision }))}</span><span class="muted">›</span></a>` : ""}</div></section>
    ${q.status === "sent" && mine ? `<section class="panel"><header><h2>${t("qt.link")}</h2></header><div class="body form"><div class="btn-row"><input type="text" readonly value="${esc(link)}" aria-label="${t("qt.link")}" style="flex:1;min-width:200px" id="qf-link"><button class="btn" data-act="quote-copy">${t("qt.copy")}</button></div><a class="btn primary" href="#q-${q.token}">${t("qt.openCustomer")} ›</a><p class="muted small">${t("qt.linkHelp")}</p></div></section>` : q.status !== "superseded" && q.token ? `<section class="panel"><header><h2>${t("qt.link")}</h2></header><div class="body"><a class="btn" href="#q-${q.token}">${t("qt.openCustomer")} ›</a></div></section>` : ""}</div>
    ${mine ? `<div class="btn-row no-print">${q.status === "accepted" && !won ? `<button class="btn primary" data-act="quote-won" title="${esc(t("qt.wonHelp"))}">${t("qt.won")}</button>` : ""}${q.status === "accepted" && won ? `<span class="chip good">${t("qt.dealWon")}</span>` : ""}${q.status === "sent" ? `<button class="btn" data-act="quote-renew" title="${esc(t("qt.renewHelp"))}">${t("qt.renew")}</button>` : ""}${["sent", "declined"].includes(q.status) && !newer ? `<button class="btn" data-act="quote-revise" title="${esc(t("qt.reviseHelp"))}">${t("qt.revise")}</button>` : ""}<button class="btn ghost" data-act="quote-print">${t("qt.print")}</button></div>
      ${q.status === "accepted" && !won ? `<p class="muted small">${t("qt.wonHelp")}</p>` : ""}` : ""}
    ${quoteDoc(q)}</div>`;
}
function viewCustomerQuote(token) {
  const q = (S.d.quotes || []).find((x) => x.token === token && x.status !== "draft");
  const back = q ? `<a class="btn sm" href="#quote-${q.id}">‹ ${t("qt.cust.back")}</a>` : `<a class="btn sm" href="#home">‹ ${t("nav.home")}</a>`;
  const top = `<div class="cust-banner no-print"><span>${t("qt.cust.banner")}</span>${back}</div>`;
  if (!q) return `${top}<main id="main" class="cust"><p class="panel empty">${t("qt.cust.invalid")}</p></main>`;
  if (q.status === "superseded") return `${top}<main id="main" class="cust"><p class="panel empty">${t("qt.cust.superseded")}</p></main>`;
  if (!q.viewedAt) q.viewedAt = iso(TODAY);
  const st = qStatus(q), s = q.seller, err = S.custError; S.custError = null;
    return `${top}<main id="main" class="cust"><p class="cust-intro">${esc(t("qt.cust.intro", { s: s.name }))}</p>
    ${err ? `<div class="flag" role="alert">${esc(t("qt.cust." + err))}</div>` : ""}
    ${st === "accepted" ? `<div class="flag info" role="status">${esc(t("qt.cust.accepted", { d: fmtDate(q.respondedAt), n: q.responder.name }))}</div>` : ""}
    ${st === "declined" ? `<div class="flag info" role="status">${esc(t("qt.cust.declined", { d: fmtDate(q.respondedAt) }))}</div>` : ""}
    ${st === "expired" ? `<div class="flag" role="status">${esc(t("qt.cust.expired", { d: fmtDate(q.validUntil), s: s.name }))}</div>` : ""}
    ${quoteDoc(q)}
    ${st === "sent" ? `<section class="panel no-print"><header><h2>${t("qt.cust.acceptT")}</h2></header><div class="body form"><div class="fields-2"><div class="field"><label for="cu-name" class="req">${t("qt.cust.name")}</label><input type="text" id="cu-name" maxlength="120" autocomplete="name"></div><div class="field"><label for="cu-job">${t("qt.cust.job")}</label><input type="text" id="cu-job" maxlength="120"></div></div>
      <label class="checks"><label><input type="checkbox" id="cu-agree"> ${t("qt.cust.agree")}</label></label><button class="btn primary" data-act="cust-accept" data-tok="${esc(token)}">${t("qt.cust.accept")}</button><p class="muted small">${t("qt.cust.privacy")}</p></div></section>
      <details class="panel no-print"><summary class="body"><b>${t("qt.cust.declineT")}</b></summary><div class="body form"><div class="field"><label for="cu-dname" class="req">${t("qt.cust.name")}</label><input type="text" id="cu-dname" maxlength="120"></div><div class="field"><label for="cu-reason">${t("qt.cust.reason")}</label><textarea id="cu-reason" maxlength="2000"></textarea></div><button class="btn danger" data-act="cust-decline" data-tok="${esc(token)}">${t("qt.cust.decline")}</button></div></details>` : ""}
    <div class="no-print"><button class="btn" data-act="quote-print">${t("qt.print")}</button></div></main>`;
}

/* wiring: routes, navigation, deal page, actions */
ROUTES.quotes = viewQuotes; GUARD.quotes = ["ae", "manager", "admin"];
for (const r of ["ae", "manager", "admin"]) { const n = NAV[r], i = n.indexOf("pipeline"); n.splice(i + 1, 0, "quotes"); }
NAV_LABEL.quotes = "qt.nav";
ICO.quotes = '<path d="M7 3h7l4 4v14H7z" stroke-linejoin="round"/><path d="M10 11h5M10 14.5h5M10 18h3" stroke-linecap="round"/>';
const parseRouteBase = parseRoute;
parseRoute = function () {
  const h = (location.hash || "#home").slice(1);
  if (h.startsWith("q-")) return { name: "customer", view: () => viewCustomerQuote(h.slice(2)) };
  if (h.startsWith("quote-")) return { name: "quote", view: GUARD.quotes.includes(S.role) ? () => viewQuote(h.slice(6)) : viewNotFound };
  return parseRouteBase();
};
const activeNavBase = activeNav;
activeNav = function (route) { return route.name === "quote" ? "quotes" : activeNavBase(route); };
const viewDealBase = viewDeal;
viewDeal = function (id) {
  const html = viewDealBase(id), o = opp(id); if (!o || !visibleOpps().includes(o)) return html;
  const marker = `<section class="panel"><header><h2>${t("deal.history")}</h2>`;
  return html.includes(marker) ? html.replace(marker, quotesPanel(o) + marker) : html;
};
ROUTES.pipeline = ROUTES.pipeline; // unchanged
function readEditor(q) {
  for (const el of document.querySelectorAll("[data-qf]")) q[el.dataset.qf] = el.value;
  for (const el of document.querySelectorAll("[data-ql]")) { const l = q.lines[+el.dataset.ql], k = el.dataset.k; if (!l || k === "cat") continue; l[k] = ["qty", "price", "disc", "vat"].includes(k) ? (el.value === "" ? NaN : +el.value) : el.value; }
}
document.addEventListener("input", (e) => {
  const el = e.target; if (!el.matches("[data-qf], [data-ql]")) return;
  const q = quote((location.hash.match(/^#quote-(.+)$/) || [])[1]); if (!q || q.status !== "draft") return;
  readEditor(q);
  q.lines.forEach((l, i) => { const c = document.getElementById("qlt-" + i); if (c) c.textContent = lineOk(l) ? qmoney(lineAmt(l).net) : "—"; });
  const tt = document.getElementById("qt-totals"); if (tt) tt.innerHTML = totalsHtml(q);
});
document.addEventListener("change", (e) => {
  const el = e.target; if (!el.matches('[data-ql][data-k="cat"]') || el.value === "") return;
  const q = quote((location.hash.match(/^#quote-(.+)$/) || [])[1]); if (!q) return;
  readEditor(q); const l = q.lines[+el.dataset.ql]; if (!l.desc.trim() || l.desc === opp(q.opp).name) l.desc = WS().catalogue[+el.value][S.lang === "fr" ? 1 : 0]; render();
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act; if (!act.startsWith("quote-") && !act.startsWith("cust-")) return;
  const qid = (location.hash.match(/^#quote-(.+)$/) || [])[1], q = qid && quote(qid);
  switch (act) {
    case "quote-new": { const o = opp(b.dataset.opp); const nq = makeQuote(o); S.d.quotes.push(nq); location.hash = `quote-${nq.id}`; break; }
    case "quote-pick": { const deals = visibleOpps().filter((o) => isOpenOpp(o) && o.owner === me().id);
      openDialog(t("qt.new"), `<div class="field"><label for="dl-qopp">${t("qt.pickDeal")}</label><select id="dl-qopp">${deals.map((o) => `<option value="${o.id}">${esc(o.name)} · ${esc(account(o.account).name)}</option>`).join("")}</select></div>`, t("qt.create"), (d) => { const o = opp(d.querySelector("#dl-qopp").value); if (!o) return; const nq = makeQuote(o); S.d.quotes.push(nq); location.hash = `quote-${nq.id}`; }); break; }
    case "quote-add-line": readEditor(q); q.lines.push({ desc: "", qty: 1, unit: "", price: 0, disc: 0, vat: WS().legal.vatRate }); render(); break;
    case "quote-rm-line": readEditor(q); q.lines.splice(+b.dataset.i, 1); render(); break;
    case "quote-save": readEditor(q); toast(t("qt.saved")); break;
    case "quote-del": S.d.quotes = S.d.quotes.filter((x) => x !== q); toast(t("qt.deleted")); location.hash = `deal-${q.opp}`; break;
    case "quote-send": { readEditor(q); const probs = sendProblems(q); if (probs.length) { S.qProblems = probs; render(); window.scrollTo(0, 0); break; }
      const email = $("#qf-email")?.checked && q.recipientEmail; sendQuoteNow(q); toast(email ? t("qt.emailed", { email: q.recipientEmail }) : t("qt.sent", { ref: qRef(q) })); render(); window.scrollTo(0, 0); break; }
    case "quote-copy": navigator.clipboard?.writeText($("#qf-link").value).catch(() => {}); $("#qf-link").select(); toast(t("qt.copied")); break;
    case "quote-renew": q.token = newToken(); toast(t("qt.renewed")); render(); break;
    case "quote-revise": { const nq = makeQuote(opp(q.opp), { number: q.number, revision: q.revision + 1, title: q.title, intro: q.intro, terms: q.terms, recipient: q.recipient, recipientEmail: q.recipientEmail, lines: q.lines.map((l) => ({ ...l })) }); S.d.quotes.push(nq); location.hash = `quote-${nq.id}`; break; }
    case "quote-won": { const o = opp(q.opp), wonSt = S.d.stages.find((s) => s.won); o.history.push({ from: o.stage, to: wonSt.id, at: iso(TODAY) + "T10:00:00" }); o.stage = wonSt.id; o.moved = iso(TODAY); o.amount = qTotals(q.lines).sub; toast(t("qt.wonDone")); render(); break; }
    case "quote-print": window.print(); break;
    case "cust-accept": case "cust-decline": {
      const cq = S.d.quotes.find((x) => x.token === b.dataset.tok); if (!cq || qStatus(cq) !== "sent") break;
      const accept = act === "cust-accept", name = (accept ? $("#cu-name") : $("#cu-dname")).value.trim();
      if (!name) { S.custError = "needName"; render(); break; }
      if (accept && !$("#cu-agree").checked) { S.custError = "needAgree"; render(); break; }
      cq.status = accept ? "accepted" : "declined"; cq.respondedAt = iso(TODAY); cq.responder = { name, title: accept ? $("#cu-job").value.trim() || null : null }; cq.reason = accept ? null : $("#cu-reason").value.trim() || null;
      const ref = qRef(cq); notify(cq.owner, `${name} ${accept ? "accepted" : "declined"} quote ${ref}.`, `${name} a ${accept ? "accepté" : "refusé"} le devis ${ref}.`, `quote-${cq.id}`);
      render(); window.scrollTo(0, 0); break; }
  }
});

S.d = withQuotes(S.d, S.ws);

window.addEventListener("hashchange", () => { document.body.classList.remove("nav-open"); S.bell = false; render(); window.scrollTo(0, 0); });
render();
</script>

<title>CLEAN UAT prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: app shell — top bar, left navigation, main work area; navigation collapses behind a menu button on phones. */
:root {
  --bg: oklch(0.985 0.003 250);
  --surface: oklch(1 0 0);
  --sunken: oklch(0.965 0.006 250);
  --fg: oklch(0.24 0.02 255);
  --muted: oklch(0.5 0.02 255);
  --border: oklch(0.9 0.008 250);
  --accent: oklch(0.5 0.13 245);
  --accent-soft: oklch(0.95 0.03 245);
  --on-accent: oklch(0.99 0 0);
  --good: oklch(0.52 0.12 150);
  --good-soft: oklch(0.95 0.04 150);
  --warn: oklch(0.58 0.13 70);
  --warn-soft: oklch(0.96 0.05 80);
  --bad: oklch(0.55 0.19 27);
  --bad-soft: oklch(0.96 0.03 27);
  --note: oklch(0.55 0.12 300);
  --note-soft: oklch(0.96 0.03 300);
  --shadow: 0 1px 2px oklch(0.3 0.02 255 / 0.06), 0 4px 16px oklch(0.3 0.02 255 / 0.06);
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 8px;
}
/* Light mode only, by request: no dark palette, whatever the viewer's theme. */
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.25; }
h1 { font-size: 1.5rem; font-weight: 650; }
h2 { font-size: 1.1rem; font-weight: 620; }
h3 { font-size: 0.95rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }

/* prototype banner */
.proto-bar { background: var(--note-soft); color: var(--fg); border-bottom: 1px solid var(--border); font-size: 0.82rem;
  padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.proto-bar strong { color: var(--note); }
.proto-bar .spacer { flex: 1; }

/* top bar */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); box-shadow: 0 1px 0 var(--border); }
.topbar { background: var(--surface);
  display: flex; align-items: center; gap: 12px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.brand { font-weight: 750; letter-spacing: 0.08em; display: flex; align-items: center; gap: 10px; }
.brand-mark { display: inline-grid; grid-template-columns: repeat(5, 6px); gap: 2px; }
.brand-mark i { height: 14px; background: var(--brand-ink, var(--accent)); border-radius: 1px; opacity: 0.35; }
.brand-mark i:nth-child(1) { opacity: 1; } .brand-mark i:nth-child(2) { opacity: 0.85; } .brand-mark i:nth-child(3) { opacity: 0.7; } .brand-mark i:nth-child(4) { opacity: 0.55; }
.org { color: var(--muted); font-size: 0.85rem; border-left: 1px solid var(--border); padding-left: 12px; }
.topbar .grow { flex: 1; }
.ctl { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; }
.ctl label { color: var(--muted); }
select, input[type="text"], input[type="email"], input[type="date"], input[type="number"], textarea {
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; min-width: 0; }
textarea { width: 100%; min-height: 76px; resize: vertical; }
.btn.menu-btn { display: none; }
.bell { position: relative; }
.bell .dot { position: absolute; top: -4px; right: -6px; background: var(--bad); color: #fff; border-radius: 999px; font-size: 0.68rem; padding: 0 5px; line-height: 16px; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); border-radius: 6px;
  padding: 6px 12px; cursor: pointer; font-weight: 550; text-decoration: none; color: var(--fg); white-space: nowrap; }
.btn:hover { background: var(--sunken); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { padding: 3px 8px; font-size: 0.82rem; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* horizontal menu */
.navbar { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; border-top: 1px solid var(--border);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.navbar a { display: inline-flex; align-items: center; gap: 6px; padding: 10px 12px; color: var(--muted); text-decoration: none; white-space: nowrap; font-weight: 560; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.navbar a:hover { color: var(--fg); }
.navbar a.active { color: var(--accent); border-bottom-color: var(--accent); }
.count { font-size: 0.72rem; background: var(--sunken); border: 1px solid var(--border); border-radius: 999px; padding: 0 7px; color: var(--muted); font-weight: 600; }
.navbar a.active .count { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.subnav { display: flex; gap: 6px; flex-wrap: wrap; }
.subnav a { padding: 4px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); text-decoration: none; font-size: 0.85rem; font-weight: 560; }
.subnav a.active { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
/* dashboard */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; }
.stat .d { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
.stat .d.bad { color: var(--bad); font-weight: 600; }
.hbars { list-style: none; margin: 0; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 4px; }
.hbars li { display: grid; grid-template-columns: minmax(90px, 34%) minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 3px 4px; border-radius: 4px; }
.hbars li:hover { background: var(--sunken); }
.hb-l { font-size: 0.86rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb-t { height: 12px; position: relative; }
.hb-t i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 0 4px 4px 0; }
.hb-v { font-size: 0.84rem; color: var(--muted); text-align: right; white-space: nowrap; }
.panel.hero-cta { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: 18px 20px; background: var(--accent-soft); border-color: transparent; }
.hero-cta p { color: var(--muted); margin-top: 2px; }
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.type-card { display: flex; flex-direction: column; gap: 10px; padding: 16px; }
.type-card .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 6px; }
.alist { list-style: none; margin: 0; padding: 0; }
.alist li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--border); }
.alist li:first-child { border-top: 0; }
.alist .meta { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; font-size: 0.82rem; color: var(--muted); margin-top: 3px; }
.alist li.done .t { text-decoration: line-through; color: var(--muted); }
.fields-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
dialog .body { max-height: 68vh; overflow: auto; }
/* stage-by-stage pipeline chart */
.pv-controls { display: flex; gap: 10px 16px; flex-wrap: wrap; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.pv-controls .lbl { font-size: 0.8rem; color: var(--muted); margin-right: 4px; }
.sc { padding: 8px 16px 14px; display: flex; flex-direction: column; }
.sc-row { display: grid; grid-template-columns: minmax(140px, 24%) minmax(0, 1fr) 130px 96px 132px; gap: 12px; align-items: center; padding: 8px 4px; border-top: 1px solid var(--border); }
.sc-row.head { border-top: 0; padding-block: 4px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
.sc-row:not(.head):hover { background: var(--sunken); }
.sc-l { display: flex; flex-direction: column; min-width: 0; }
.sc-l .x { font-size: 0.78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc-t { display: flex; gap: 2px; height: 16px; align-items: stretch; }
.sc-t i { display: block; min-width: 2px; background: var(--accent); }
.sc-t i:last-child { border-radius: 0 4px 4px 0; }
.sc-v, .sc-c, .sc-a { font-size: 0.85rem; text-align: right; white-space: nowrap; }
.sc-c { color: var(--fg); font-weight: 600; }
.sc-a { color: var(--muted); display: flex; gap: 6px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; padding: 10px 16px 0; font-size: 0.82rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend b { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.drop { padding: 0 16px 14px; font-size: 0.85rem; }
@media (max-width: 820px) {
  .sc-row { grid-template-columns: minmax(0, 1fr) auto auto; }
  .sc-row .sc-t { grid-column: 1 / -1; order: 5; }
  .sc-row .sc-a { display: none; }
  .sc-row.head { display: none; }
}

dialog.wide { width: min(720px, calc(100vw - 32px)); }
main { min-width: 0; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-head .lead { color: var(--muted); margin-top: 4px; max-width: 70ch; }
.crumbs { font-size: 0.82rem; color: var(--muted); margin-bottom: 4px; }
.crumbs a { color: var(--muted); }

/* surfaces */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); }
.panel > header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.panel > .body { padding: 16px; }
.grid { display: grid; gap: 16px; }
.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.stat { padding: 14px 16px; }
.stat .v { font-size: 1.45rem; font-weight: 650; margin-top: 2px; }
.next { display: flex; flex-direction: column; }
.next a.item { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--border); text-decoration: none; color: var(--fg); }
.next a.item:first-child { border-top: 0; }
.next a.item:hover { background: var(--sunken); }
.sev { width: 8px; height: 8px; border-radius: 99px; background: var(--accent); }
.sev.bad { background: var(--bad); } .sev.warn { background: var(--warn); } .sev.good { background: var(--good); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

/* tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; background: var(--sunken); white-space: nowrap; }
tbody tr:hover { background: var(--sunken); }
td.r, th.r { text-align: right; }
tr.link { cursor: pointer; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--sunken); color: var(--muted); white-space: nowrap; }
.chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }

/* kanban */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--sunken); border: 1px solid var(--border); border-radius: var(--r); display: flex; flex-direction: column; min-height: 240px; }
.col.drop { outline: 2px dashed var(--accent); outline-offset: -2px; }
.col > header { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.col > header .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
.cards { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px; cursor: grab; display: flex; flex-direction: column; gap: 6px; }
.card:hover { border-color: var(--accent); }
.card .t { font-weight: 600; }
.card .row { display: flex; justify-content: space-between; gap: 8px; font-size: 0.82rem; color: var(--muted); }
.card select { font-size: 0.78rem; padding: 2px 4px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* forms */
.form { display: flex; flex-direction: column; gap: 16px; }
.section { display: flex; flex-direction: column; gap: 12px; }
.section + .section { border-top: 1px solid var(--border); padding-top: 16px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > label, .field > .lbl { font-weight: 600; font-size: 0.88rem; }
.field .hint { color: var(--muted); font-size: 0.8rem; }
.req::after { content: " *"; color: var(--bad); }
.checks { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; font-weight: 400; }
.attendee { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 170px 32px; gap: 6px; }
.inline-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }

/* score panel */
.score { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 0; }
.gauge { display: flex; gap: 14px; align-items: center; padding: 16px; }
.ring { --p: 0; --c: var(--accent); width: 76px; height: 76px; border-radius: 50%; flex: none;
  background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--sunken) 0); display: grid; place-items: center; }
.ring span { width: 60px; height: 60px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 1.3rem; font-weight: 700; }
.breakdown { list-style: none; margin: 0; padding: 0 16px 12px; display: flex; flex-direction: column; gap: 4px; }
.breakdown li { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 8px; font-size: 0.84rem; align-items: baseline; }
.breakdown .ok { color: var(--good); } .breakdown .part { color: var(--warn); } .breakdown .no { color: var(--muted); }
.flags { display: flex; flex-direction: column; gap: 6px; padding: 12px 16px 16px; border-top: 1px solid var(--border); }
.flag { background: var(--warn-soft); border-radius: 6px; padding: 7px 10px; font-size: 0.84rem; }
.flag.info { background: var(--accent-soft); }
.band { display: flex; justify-content: space-between; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); font-size: 0.85rem; }

/* timeline */
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.timeline li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 10px; padding-bottom: 14px; position: relative; }
.timeline li::before { content: ""; position: absolute; left: 6px; top: 14px; bottom: 0; width: 2px; background: var(--border); }
.timeline li:last-child::before { display: none; }
.timeline .dot { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--accent); background: var(--surface); margin-top: 3px; }

/* flow strip */
.flow { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 0.78rem; }
.flow span { padding: 3px 8px; border-radius: 999px; background: var(--sunken); color: var(--muted); border: 1px solid var(--border); }
.flow span.done { background: var(--good-soft); color: var(--good); border-color: transparent; }
.flow span.now { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.flow i { color: var(--muted); font-style: normal; }

/* review notes */
.note { background: var(--note-soft); border-left: 3px solid var(--note); border-radius: 6px; padding: 10px 12px; font-size: 0.85rem; }
.note b { color: var(--note); }
body.hide-notes .note { display: none; }

/* bars */
.bar { height: 8px; background: var(--sunken); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar i.over { background: var(--bad); }

/* modal & toast & dropdown */
dialog { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--fg); padding: 0; width: min(520px, calc(100vw - 32px)); box-shadow: var(--shadow); }
dialog::backdrop { background: oklch(0.2 0.02 255 / 0.45); }
dialog header { padding: 14px 18px; border-bottom: 1px solid var(--border); }
dialog .body { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
dialog footer { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 8px; box-shadow: var(--shadow); z-index: 50; font-weight: 550; }
.dropdown { position: absolute; right: 0; top: calc(100% + 8px); width: min(360px, calc(100vw - 32px)); z-index: 40; box-shadow: var(--shadow); }
.dropdown .n { padding: 10px 14px; border-top: 1px solid var(--border); display: block; color: var(--fg); text-decoration: none; }
.dropdown .n:hover { background: var(--sunken); }
.dropdown .n.unread { border-left: 3px solid var(--accent); }

/* auth screens */
.auth { min-height: calc(100vh - 34px); display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.auth .box { width: min(420px, 100%); display: flex; flex-direction: column; gap: 16px; padding: 28px; }
.divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 0.8rem; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.steps span { flex: 1; min-width: 90px; font-size: 0.8rem; padding: 6px 8px; border-radius: 6px; background: var(--sunken); color: var(--muted); border: 1px solid var(--border); }
.steps span.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
pre.json { background: var(--sunken); border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-family: var(--mono); font-size: 0.78rem; overflow: auto; max-height: 420px; margin: 0; }

@media (max-width: 1100px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .score { position: static; order: -1; }
  .cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 820px) {
  .fields-2 { grid-template-columns: minmax(0, 1fr); }
  .org, .ctl label { display: none; }
  .cols-2, .cols-3 { grid-template-columns: minmax(0, 1fr); }
  .attendee { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}
@media (max-width: 480px) {
  .cols-4 { grid-template-columns: minmax(0, 1fr); }
  .topbar { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: no-preference) {
  .ring { transition: background 0.3s; }
}

/* ── Dashboard redesign (approved design canvas, Nov 2026) ─────────────────
   Left icon rail, utility bar with search, soft white cards on a cool grey
   ground, ring KPI cards, vertical stage bars, gauge, people list. */
:root {

td { border-bottom: 1px solid var(--sunken); }
.note { border-left: 0; border-radius: 14px; }
select, input[type="text"], input[type="email"], input[type="date"], input[type="number"], input[type="search"], textarea { border-radius: 10px; border-color: var(--border); }

/* shell */
.shell { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.rail { flex: 0 0 72px; position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); min-height: calc(100vh - 80px); background: var(--surface); border-radius: 22px; box-shadow: var(--shadow);

  border-bottom: 3px solid var(--accent); box-sizing: border-box; text-decoration: none; margin-bottom: 10px; }

.watch-item .hot { color: color-mix(in srgb, var(--accent) 80%, #000); }
.overview { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }

/* ───────────────────────── rules engine (mirrors brief §6 defaults) ───────────────────────── */
const RULES = {
  weights: { objective: 15, success: 15, outcomes: 5, attendees: 15, dm: 5, senior: 5, plan: 10, opp: 5, topics: 10, followup: 5, leadtime: 10 },
  typePoints: { technical_deep_dive: 5, pricing_review: 3, contract_review: 4, discovery_call: 2, demo: 4, workshop: 6, business_case: 6, executive_briefing: 5, proof_of_concept: 10, onboarding_review: 3 },
  durationPoints: { "1h": 0, half_day: 2, full_day: 4 }, rolePoints: { lead: 3, co_present: 2, content: 1, coach: 0 },
  bands: [{ key: "light", max: 5, lead: 3, typical: "≈ 3 h" }, { key: "standard", max: 9, lead: 5, typical: "≈ 1 d" }, { key: "significant", max: 14, lead: 10, typical: "≈ 3 d" }, { key: "major", max: Infinity, lead: 15, typical: "≥ 1 wk" }],
};
const OUTCOME_WORDS = /\b(so that|in order to|decide|agree|approve|sign|afin|pour que|décid|valid|approuv|sign)/i;
const COMMIT_WORDS = /\b(agrees?|commits?|confirms?|signs?|names?|presents?|validates?|approves?|s’engage|confirme|valide|signe|présente|approuve)\b/i;
const TECH_WORDS = /\b(api|integration|intégration|architecture|security|sécurité|sso|network|réseau|migration|dn\d*|pressure|pression|atex|cryog\w*)\b/gi;
function assess(a, hasOpp) {
  const W = RULES.weights, crit = [];
  const add = (key, pts, max) => crit.push({ key, pts, max, state: pts >= max ? "ok" : pts > 0 ? "part" : "no" });
  const obj = (a.objective || "").trim();
  add("objective", obj.length >= 60 && OUTCOME_WORDS.test(obj) ? W.objective : obj.length >= 25 ? Math.round(W.objective / 2) : 0, W.objective);
  const suc = (a.success || "").trim();
  add("success", suc.length >= 40 && COMMIT_WORDS.test(suc) ? W.success : suc.length >= 15 ? Math.round(W.success / 2) : 0, W.success);
  add("outcomes", (a.outcomes || []).length ? W.outcomes : 0, W.outcomes);
  const named = (a.attendees || []).filter((p) => p.name?.trim() && p.title?.trim()).length;
  add("attendees", named >= 2 ? W.attendees : named === 1 ? Math.round(W.attendees / 2) : 0, W.attendees);
  add("dm", (a.attendees || []).some((p) => p.role === "decision_maker" || p.role === "sponsor") ? W.dm : 0, W.dm);
  add("senior", a.senior ? W.senior : 0, W.senior);
  add("plan", { none: 0, informal: 5, documented: 10, formal: 10 }[a.plan] ?? 0, W.plan);
  add("opp", hasOpp ? W.opp : 0, W.opp);
  const top = (a.topics || "").trim();
  add("topics", top.length >= 50 ? W.topics : top.length >= 15 ? Math.round(W.topics / 2) : 0, W.topics);
  add("followup", (a.followup || "").trim().length >= 3 ? W.followup : 0, W.followup);
  // effort
  let points = (RULES.typePoints[a.type] ?? 0) + (RULES.durationPoints[a.duration] ?? 0) + (RULES.rolePoints[a.role] ?? 0) + (a.deliverables || []).length + (a.extras || []).length * 2;
  const band = RULES.bands.find((b) => points <= b.max);
  const wd = a.target ? workingDaysBetween(iso(TODAY), a.target) : 0;
  add("leadtime", wd >= band.lead ? W.leadtime : wd >= Math.ceil(band.lead / 2) ? Math.round(W.leadtime / 2) : 0, W.leadtime);
  const score = crit.reduce((s, c) => s + c.pts, 0);
  const flags = [];
  if (a.target && wd < band.lead) flags.push({ key: "tooSoon", vars: { n: band.lead } });
  if (["workshop", "executive_briefing"].includes(a.type) && !["c_level", "vp"].includes(a.senior)) flags.push({ key: "noSenior" });
  if (!(a.attendees || []).some((p) => p.role === "decision_maker" || p.role === "sponsor")) flags.push({ key: "noDm" });
  if (a.plan === "none" && a.role !== "coach") flags.push({ key: "noPlan" });
  if (!hasOpp && ["significant", "major"].includes(band.key)) flags.push({ key: "highNoOpp" });
  if (a.target && !a.confirmed) flags.push({ key: "notConfirmed" });
  const tech = (`${a.objective} ${a.topics}`.match(TECH_WORDS) || []).length;
  if (tech >= 2 && a.fn && a.fn !== "f5") flags.push({ key: "technical", info: true });
  const label = score >= 75 ? "ready" : score >= 50 ? "workable" : "needs";
  return { score, crit, points, band, wd, flags, label };
}

/** Single-series horizontal bar chart: one hue, value printed on every row, native tooltip. */
function hbars(rows, max) {
  if (!rows.length || rows.every((r) => !r.value)) return `<p class="empty">${t("dash.noData")}</p>`;
  const top = max ?? Math.max(...rows.map((r) => r.value), 1);
  return `<ul class="hbars">${rows.map((r) => `<li title="${esc(r.label)}: ${esc(r.display)}"><span class="hb-l">${r.href ? `<a href="#${r.href}">${esc(r.label)}</a>` : esc(r.label)}</span><span class="hb-t"><i style="width:${r.value > 0 ? Math.max(2, (r.value / top) * 100) : 0}%"></i></span><span class="hb-v num">${esc(r.display)}</span></li>`).join("")}</ul>`;
}
const panelChart = (title, body, extra = "") => `<section class="panel"><header><h2>${esc(title)}</h2>${extra}</header>${body}</section>`;
function todoList(items) {
  return `<div class="next">${items.length ? items.map(([sev, txt, href]) => `<a class="item" href="#${href}"><span class="sev ${sev}"></span><span>${esc(txt)}</span><span class="muted">›</span></a>`).join("") : `<p class="empty">${t("home.nothing")}</p>`}</div>`;
}
function stageRows(opps) {
  return S.d.stages.filter((s) => !s.won && !s.lost).map((s) => { const xs = opps.filter((o) => o.stage === s.id); return { label: L(s), value: sum(xs, (o) => o.amount), display: `${money(sum(xs, (o) => o.amount))} · ${xs.length}` }; });
}
const actionOverdue = (x) => x.status === "open" && x.due < iso(TODAY);
function actionItem(x, mode) {
  const o = x.opp && opp(x.opp), due = actionOverdue(x) ? `<span class="chip bad">${t("actions.overdue")} · ${fmtDate(x.due)}</span>` : x.status === "done" ? `<span class="chip good">${t("actions.done")}</span>` : `<span class="chip">${t("actions.dueOn", { d: fmtDate(x.due) })}</span>`;
  const who = mode === "sent" ? t("actions.toWho", { who: user(x.to).name }) : t("actions.from", { who: user(x.from).name });
  const canDone = x.status === "open" && x.to === me().id;
  return `<li class="${x.status === "done" ? "done" : ""}"><div><p class="t">${esc(x.title)}</p><div class="meta">${due}<span>${esc(who)}</span>${o ? `<a href="#deal-${o.id}">${esc(o.name)}</a>` : ""}</div>${x.note ? `<p class="small muted" style="margin-top:4px">${esc(x.note)}</p>` : ""}</div>
    ${canDone ? `<button class="btn sm" data-act="action-done" data-id="${x.id}">✓ ${t("actions.markDone")}</button>` : ""}</li>`;
}
const actionList = (xs, mode) => (xs.length ? `<ul class="alist">${xs.map((x) => actionItem(x, mode)).join("")}</ul>` : `<p class="empty">${t("actions.none")}</p>`);
const sortActions = (xs) => [...xs].sort((a, b) => (a.status === "done") - (b.status === "done") || a.due.localeCompare(b.due));
function allowedFns() { return S.d.fns.filter((f) => f.active && (f.rules.who !== "sales" || ["ae", "manager", "admin"].includes(S.role))); }
function homeHead(extra = "") {
  const m = me();
  return `<div class="page-head"><div><p class="eyebrow">${esc(t("roles." + S.role))}</p><h1>${esc(t("home.greet", { name: m.name.split(" ")[0] }))}</h1></div>${extra}</div>`;
}

/* ── stage-by-stage pipeline analytics ── */
// Reference palette categorical slots 1–6 (validated: adjacent CVD ΔE ≥ 9.1, normal-vision ≥ 19.6). Colour follows the entity, never its rank.
const CAT = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300"];
const OTHER = "#8f8e88";
// Ordinal blue ramp for probability bands (validated --ordinal: light end 2.44:1 on the surface).
const BANDS = [{ key: "bandHigh", min: 70, color: "#104281" }, { key: "bandMid", min: 30, color: "#2a78d6" }, { key: "bandLow", min: 0, color: "#6da7ec" }];
S.pv = { metric: "value", colorBy: "none", view: "chart" };
const openStages = () => S.d.stages.filter((x) => !x.won && !x.lost);
function reachedIdx(o) {
  const os = openStages(); if (stage(o.stage).won) return os.length;
  return Math.max(-1, ...o.history.map((h) => os.findIndex((x) => x.id === h.to)));
}
function conversions(opps) {
  const os = openStages(), r = opps.map(reachedIdx);
  return os.map((st, i) => { const at = r.filter((x) => x >= i).length, next = r.filter((x) => x >= i + 1).length; return { st, nextLabel: i + 1 < os.length ? L(os[i + 1]) : t("pv.wonLabel"), at, next, rate: at ? Math.round((next / at) * 100) : null }; });
}
function segmentKeys(opps, colorBy) {
  if (colorBy === "owner") { const ids = new Set(opps.map((o) => o.owner)); return S.d.users.filter((u) => ids.has(u.id)).map((u) => ({ key: u.id, label: u.name })); }
  if (colorBy === "rel") return Object.keys(I18N.en.rel).map((k) => ({ key: k, label: t("rel." + k) }));
  return [{ key: "all", label: "" }];
}
const segOf = (o, colorBy) => (colorBy === "owner" ? o.owner : colorBy === "rel" ? account(o.account).rel : "all");
function segColors(keys) { return Object.fromEntries(keys.map((k, i) => [k.key, keys.length === 1 ? "var(--accent)" : i < CAT.length ? CAT[i] : OTHER])); }
function legend(keys, colors) { return keys.length > 1 ? `<div class="legend">${keys.map((k) => `<span><b style="background:${colors[k.key]}"></b>${esc(k.label)}</span>`).join("")}</div>` : ""; }
const metricOf = (xs, metric) => (metric === "count" ? xs.length : sum(xs, (o) => o.amount));
const metricText = (xs) => `${money(sum(xs, (o) => o.amount))} · ${xs.length}`;

function stageChart(opps, compact) {
  const pv = compact ? { metric: "value", colorBy: "none", view: "chart" } : S.pv;
  const open = opps.filter(isOpenOpp), os = openStages(), conv = conversions(opps);
  const keys = segmentKeys(open, pv.colorBy), colors = segColors(keys);
  const rows = os.map((st, i) => { const xs = open.filter((o) => o.stage === st.id); const ages = xs.map((o) => daysAgo(o.moved)); return { st, xs, conv: conv[i], avg: ages.length ? Math.round(sum(ages, (a) => a) / ages.length) : null, stalled: ages.filter((a) => a > st.target).length }; });
  const max = Math.max(1, ...rows.map((r) => metricOf(r.xs, pv.metric)));
  const seg = (btns, k) => `<div class="seg" role="group">${btns.map(([v, label]) => `<button data-act="pv" data-k="${k}" data-v="${v}" aria-pressed="${pv[k] === v}">${esc(label)}</button>`).join("")}</div>`;
  const controls = compact ? "" : `<div class="pv-controls"><span><span class="lbl">${t("pv.metric")}</span>${seg([["value", t("pv.value")], ["count", t("pv.count")]], "metric")}</span>
    <span><span class="lbl">${t("pv.colorBy")}</span>${seg([["none", t("pv.none")], ["owner", t("pv.owner")], ["rel", t("pv.rel")]], "colorBy")}</span>
    <span><span class="lbl">${t("pv.view")}</span>${seg([["chart", t("pv.chart")], ["table", t("pv.table")]], "view")}</span></div>`;
  if (pv.view === "table") {
    return `${controls}<div class="table-wrap"><table><thead><tr><th>${t("pv.stage")}</th><th class="r">${t("pv.value")}</th><th class="r">${t("pv.count")}</th>${keys.length > 1 ? keys.map((k) => `<th class="r">${esc(k.label)}</th>`).join("") : ""}<th class="r">${t("pv.conv")}</th><th class="r">${t("pv.age")}</th></tr></thead><tbody>
      ${rows.map((r) => `<tr><td>${esc(L(r.st))}<div class="muted small">${esc(t("pv.exit", { c: L(r.st, "exit") }))}</div></td><td class="r num">${money(sum(r.xs, (o) => o.amount))}</td><td class="r num">${r.xs.length}</td>${keys.length > 1 ? keys.map((k) => { const ys = r.xs.filter((o) => segOf(o, pv.colorBy) === k.key); return `<td class="r num">${pv.metric === "count" ? ys.length : money(sum(ys, (o) => o.amount))}</td>`; }).join("") : ""}<td class="r num">${r.conv.rate == null ? t("misc.none") : `${r.conv.rate} %`}</td><td class="r num">${r.avg == null ? t("misc.none") : t("pv.ageVal", { n: r.avg })}</td></tr>`).join("")}</tbody></table></div>`;
  }
  return `${controls}${legend(keys, colors)}<div class="sc" role="table" aria-label="${t("pv.main")}">
    <div class="sc-row head" role="row"><span>${t("pv.stage")}</span><span></span><span style="text-align:right">${pv.metric === "count" ? t("pv.count") : t("pv.value")}</span><span style="text-align:right">${t("pv.conv")}</span><span style="text-align:right">${t("pv.age")}</span></div>
    ${rows.map((r) => {
      const parts = keys.map((k) => ({ k, xs: r.xs.filter((o) => segOf(o, pv.colorBy) === k.key) })).filter((x) => x.xs.length);
      const bars = parts.map((x) => `<i style="width:${(metricOf(x.xs, pv.metric) / max) * 96}%;background:${colors[x.k.key]}" title="${esc(L(r.st))}${x.k.label ? ` · ${esc(x.k.label)}` : ""}: ${esc(metricText(x.xs))}"></i>`).join("");
      return `<div class="sc-row" role="row" title="${esc(t("pv.exit", { c: L(r.st, "exit") }))}"><div class="sc-l"><b>${esc(L(r.st))}</b><span class="x">${esc(t("pv.exit", { c: L(r.st, "exit") }))}</span></div>
        <div class="sc-t">${bars}</div><div class="sc-v num">${pv.metric === "count" ? `${r.xs.length} · ${money(sum(r.xs, (o) => o.amount))}` : metricText(r.xs)}</div>
        <div class="sc-c num" title="${esc(L(r.st))} → ${esc(r.conv.nextLabel)}: ${r.conv.next}/${r.conv.at}">${r.conv.rate == null ? t("misc.none") : `→ ${r.conv.rate} %`}</div>
        <div class="sc-a num">${r.avg == null ? t("misc.none") : t("pv.ageVal", { n: r.avg })} <span class="muted small">(${t("pv.target", { n: r.st.target })})</span>${r.stalled ? `<span class="chip warn">${t("pv.stalled", { n: r.stalled })}</span>` : ""}</div></div>`; }).join("")}
  </div>`;
}

function conversionView(opps) {
  const conv = conversions(opps).filter((c) => c.at > 0);
  if (!conv.length) return `<p class="empty">${t("dash.noData")}</p>`;
  const worst = conv.reduce((a, b) => (b.rate < a.rate ? b : a));
  return `${hbars(conv.map((c) => ({ label: `${L(c.st)} → ${c.nextLabel}`, value: c.rate, display: `${c.rate} % · ${c.next}/${c.at}` })), 100)}<p class="drop"><span class="chip bad">↓</span> ${esc(t("pv.dropOff", { a: L(worst.st), b: worst.nextLabel, r: worst.rate }))}</p>`;
}

function forecastView(opps) {
  const open = opps.filter(isOpenOpp), today = iso(TODAY);
  const months = [...Array(6)].map((_, i) => { const d = new Date(TODAY.getFullYear(), TODAY.getMonth() + i, 1); return { key: iso(d).slice(0, 7), label: d.toLocaleDateString(locale(), { month: "short", year: "numeric" }) }; });
  const rows = [{ key: "past", label: t("pv.pastDue"), xs: open.filter((o) => o.close < today) }, ...months.map((m) => ({ ...m, xs: open.filter((o) => o.close >= today && o.close.slice(0, 7) === m.key) }))].filter((r, i) => i > 0 || r.xs.length);
  const max = Math.max(1, ...rows.map((r) => sum(r.xs, (o) => o.amount)));
  const band = (o) => BANDS.find((b) => stage(o.stage).prob >= b.min);
  return `<div class="legend">${BANDS.map((b) => `<span><b style="background:${b.color}"></b>${t("pv." + b.key)}</span>`).join("")}</div>
    <div class="sc">${rows.map((r) => { const parts = BANDS.map((b) => ({ b, xs: r.xs.filter((o) => band(o) === b) })).filter((x) => x.xs.length);
      return `<div class="sc-row" style="grid-template-columns:minmax(110px,26%) minmax(0,1fr) 130px"><div class="sc-l"><b>${esc(r.label)}</b></div><div class="sc-t">${parts.map((x) => `<i style="width:${(sum(x.xs, (o) => o.amount) / max) * 96}%;background:${x.b.color}" title="${esc(r.label)} · ${esc(t("pv." + x.b.key))}: ${esc(metricText(x.xs))}"></i>`).join("")}</div><div class="sc-v num">${r.xs.length ? metricText(r.xs) : t("misc.none")}</div></div>`; }).join("")}</div>`;
}


function weekStart() { const d = new Date(TODAY); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return iso(d); }

/* request form: rendered from template JSON */
function fieldHtml(f, a, types) {
  const id = `f-${f.key}`, lbl = `${esc(L(f, "label"))}`, hint = f[`hint_${S.lang}`] ? `<span class="hint">${esc(f[`hint_${S.lang}`])}</span>` : "", rq = f.required ? "req" : "";
  const v = a[f.key];
  switch (f.type) {
    case "textarea": return `<div class="field"><label for="${id}" class="${rq}">${lbl}</label>${hint}<textarea id="${id}" data-field="${f.key}">${esc(v)}</textarea></div>`;
    case "text": return `<div class="field"><label for="${id}" class="${rq}">${lbl}</label>${hint}<input type="text" id="${id}" data-field="${f.key}" value="${esc(v)}"></div>`;
    case "date": return `<div class="field"><label for="${id}" class="${rq}">${lbl}</label><input type="date" id="${id}" data-field="${f.key}" value="${esc(v)}" min="${iso(TODAY)}"></div>`;
    case "checkbox": return `<div class="field"><label class="checks"><label><input type="checkbox" id="${id}" data-field="${f.key}" ${v ? "checked" : ""}> ${lbl}</label></label></div>`;
    case "select": return `<div class="field"><label for="${id}" class="${rq}">${lbl}</label>${hint}<select id="${id}" data-field="${f.key}"><option value="">${t("misc.none")}</option>${(f.key === "type" && types ? types.map((k) => OPT(k, ENG_TYPES[k][0], ENG_TYPES[k][1])) : f.options).map((o) => `<option value="${o.value}" ${o.value === v ? "selected" : ""}>${esc(L(o, "label"))}</option>`).join("")}</select></div>`;
    case "multi": return `<fieldset class="field" style="border:0;padding:0;margin:0"><legend class="lbl ${rq}">${lbl}</legend>${hint}<div class="checks">${f.options.map((o) => `<label><input type="checkbox" data-multi="${f.key}" value="${o.value}" ${(v || []).includes(o.value) ? "checked" : ""}> ${esc(L(o, "label"))}</label>`).join("")}</div></fieldset>`;
    case "attendees": return `<div class="field"><span class="lbl ${rq}">${lbl}</span>${hint}<div class="grid" id="attendees" style="gap:6px">${(v || []).map((p, i) => attendeeRow(p, i)).join("")}</div><div><button type="button" class="btn sm" data-act="add-attendee">＋ ${t("misc.add")}</button></div></div>`;
  }
  return "";
}
const attendeeRow = (p, i) => `<div class="attendee"><input type="text" aria-label="${t("cols.name")}" placeholder="${t("cols.name")}" data-att="${i}" data-k="name" value="${esc(p.name)}"><input type="text" aria-label="${t("cols.title")}" placeholder="${t("cols.title")}" data-att="${i}" data-k="title" value="${esc(p.title)}"><select aria-label="${t("cols.decision")}" data-att="${i}" data-k="role">${Object.keys(I18N.en.dr).map((k) => `<option value="${k}" ${p.role === k ? "selected" : ""}>${t("dr." + k)}</option>`).join("")}</select><button type="button" class="btn sm ghost" data-act="rm-attendee" data-i="${i}" aria-label="${t("misc.remove")}">✕</button></div>`;

function scorePanel(a, hasOpp) {
  const res = assess(a, hasOpp), c = res.label === "ready" ? "var(--good)" : res.label === "workable" ? "var(--warn)" : "var(--bad)";
  return `<header><h2>${t("score.title")}</h2><span class="chip ${res.label === "ready" ? "good" : res.label === "workable" ? "warn" : "bad"}">${t("score." + res.label)}</span></header>
    <div class="gauge"><div class="ring" style="--p:${res.score};--c:${c}" role="img" aria-label="${res.score} / 100"><span class="num">${res.score}</span></div>
      <div><p class="eyebrow">${t("score.effort")}</p><p><b>${t("band." + res.band.key)}</b> <span class="muted num">· ${res.points} pts · ${res.band.typical}</span></p><p class="muted small">${t("score.lead", { n: res.band.lead, g: res.wd })}</p></div></div>
    <p class="eyebrow" style="padding:0 16px 6px">${t("score.why")}</p>
    <ul class="breakdown">${res.crit.map((k) => `<li><span class="${k.state}">${k.state === "ok" ? "✓" : k.state === "part" ? "◐" : "○"}</span><span>${t("crit." + k.key)}</span><span class="num muted">${k.pts}/${k.max}</span></li>`).join("")}</ul>
    <div class="flags"><p class="eyebrow">${t("score.flags")}</p>${res.flags.length ? res.flags.map((f) => `<div class="flag ${f.info ? "info" : ""}">${esc(t("flag." + f.key, f.vars))}</div>`).join("") : `<p class="muted small">${t("score.noFlags")}</p>`}</div>
    <p class="muted small" style="padding:0 16px 14px">${t("req.readyNote")}</p>`;
}

const blankAnswers = () => ({ objective: "", success: "", outcomes: [], attendees: [{ name: "", title: "", role: "unknown" }], senior: "", plan: "none", topics: "", followup: me().name, type: "", duration: "", role: "", deliverables: [], extras: [], target: addDays(10), confirmed: false });

function viewRequest(id) {
  const r0 = reqById(id); if (!r0) return viewNotFound();
  const r = enrich(r0), f = fn(r.fn), tpl = TEMPLATES[f.template], m = me();
  const isRequester = r.requester === m.id, isLead = S.role === "admin" || f.lead === m.id, isAssignee = r.assignee === m.id;
  const actions = [];
  if (isRequester && r.status === "draft") actions.push(`<a class="btn primary" href="#request-new-${r.opp}">${t("deal.edit")}</a>`);
  if (isRequester && r.status === "needs_information") actions.push(`<button class="btn primary" data-act="resubmit" data-id="${r.id}">${t("req.resubmit")}</button>`);
  if (isRequester && ["draft", "new", "needs_information", "accepted", "scheduled"].includes(r.status)) actions.push(`<button class="btn danger" data-act="withdraw" data-id="${r.id}">${t("req.withdraw")}</button>`);
  if (isLead && ["new", "needs_information"].includes(r.status)) actions.push(`<button class="btn primary" data-act="tri-accept" data-id="${r.id}">${t("tri.accept")}</button>`, `<button class="btn" data-act="tri-ask" data-id="${r.id}">${t("tri.askInfo")}</button>`, `<button class="btn danger" data-act="tri-decline" data-id="${r.id}">${t("tri.decline")}</button>`);
  if ((isLead || isAssignee) && r.status === "accepted") actions.push(`<button class="btn primary" data-act="schedule" data-id="${r.id}">${t("req.schedule")}</button>`);
  if ((isLead || isAssignee) && r.status === "scheduled") actions.push(`<button class="btn primary" data-act="deliver" data-id="${r.id}">${t("req.markDelivered")}</button>`);
  if (isLead && ["accepted", "scheduled"].includes(r.status)) actions.push(`<button class="btn" data-act="tri-reassign" data-id="${r.id}">${t("tri.reassign")}</button>`);
  const canEffort = (isAssignee || isLead || S.role === "specialist") && ["scheduled", "delivered", "outcome_recorded"].includes(r.status) && S.role !== "ae";
  const canOutcome = (isAssignee || isLead || isRequester) && r.status === "delivered";

  const answers = tpl.schema.sections.map((s) => `<div class="section"><h3>${esc(L(s, "label"))}</h3><dl class="grid cols-2" style="margin:0">${s.fields.map((fl) => {

    else if (fl.type === "select") v = v ? (fl.key === "type" && ENG_TYPES[v] ? ENG_TYPES[v][S.lang === "fr" ? 1 : 0] : L(fl.options.find((o) => o.value === v) || { label: v }, "label")) : "";
    else if (fl.type === "checkbox") v = v ? t("misc.yes") : t("misc.no");
    else if (fl.type === "attendees") v = (v || []).map((p) => `${p.name} · ${p.title} · ${t("dr." + p.role)}`).join("\n");
    return `<div><dt class="eyebrow">${esc(L(fl, "label"))}</dt><dd style="margin:2px 0 0;white-space:pre-line">${esc(v) || `<span class="muted">${t("misc.none")}</span>`}</dd></div>`; }).join("")}</dl></div>`).join("");
  return `<div class="page"><div class="page-head"><div><p class="crumbs">${opp(r.opp) ? `<a href="#deal-${r.opp}">${esc(opp(r.opp).name)}</a> › ` : ""}${esc(L(f))}</p><h1>${esc(reqTitle(r))}</h1>
      <p class="lead">${esc(user(r.requester).name)} → ${esc(L(f))}${r.assignee ? ` · ${t("cols.assigned")}: ${esc(user(r.assignee).name)}` : ""}${r0.booking ? ` · ${t("req.scheduled", { d: fmtDate(r0.booking) })}` : ""}</p></div>
      <div class="btn-row">${actions.join("")}</div></div>

    <div class="split"><div class="grid">
      <section class="panel"><header><h2>${t("req.answers")}</h2><span class="muted small">${t("req.template", { t: L(tpl), v: r.version })}</span></header><div class="body form">${answers}</div></section>

const ROUTES = {

  support: viewSupport, team: viewTeam, actions: viewActions,

const GUARD = { triage: ["lead", "admin"], "admin-functions": ["lead", "admin"], "admin-templates": ["lead", "admin"], "admin-stages": ["admin"], "admin-users": ["admin"], setup: ["admin"], assignments: ["specialist", "lead"], requests: ["ae", "manager", "admin"], support: ["ae", "manager", "admin"], team: ["manager"], actions: ["ae", "manager", "admin"], ask: ["ae", "manager", "admin"], "request-new": ["ae", "manager", "admin"] };
function parseRoute() {
  const h = (location.hash || "#home").slice(1);
  if (h === "signin") return { name: "signin" };
  for (const [pre, fnc] of [["request-new-", (id) => viewRequestNew(id)], ["ask-", (id) => viewRequestNew(null, id)], ["request-", viewRequest], ["deal-", viewDeal], ["account-", viewAccount]]) {
    if (h.startsWith(pre)) { const name = pre.slice(0, -1); return { name, view: GUARD[name] && !GUARD[name].includes(S.role) ? viewNotFound : () => fnc(h.slice(pre.length)) }; }
  }
  if (GUARD[h] && !GUARD[h].includes(S.role)) return { name: h, view: viewNotFound };
  return { name: ROUTES[h] ? h : "home", view: ROUTES[h] || viewHome };
}

/* ── create / edit a user (admin) ── */
function userDialog(u) {
  const rk = Object.keys(I18N.en.roles), member = (f) => u && (f.members.includes(u.id) || f.lead === u.id);
  openDialog(u ? t("usr.edit") : t("usr.create"), `<div class="fields-2"><div class="field"><label for="dl-name" class="req">${t("usr.name")}</label><input type="text" id="dl-name" value="${esc(u?.name)}" required></div>
    <div class="field"><label for="dl-email" class="req">${t("cols.email")}</label><input type="email" id="dl-email" value="${esc(u?.email)}" required placeholder="name@${WS().domain}"></div></div>
    <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="lbl req">${t("cols.roles")}</legend><div class="checks">${rk.map((k) => `<label><input type="checkbox" name="u-role" value="${k}" ${u ? (u.roles.includes(k) ? "checked" : "") : k === "ae" ? "checked" : ""}> ${t("roles." + k)}</label>`).join("")}</div></fieldset>
    <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="lbl">${t("usr.supportTypes")}</legend><span class="hint">${t("typ.membersHint")}</span><div class="checks">${S.d.fns.map((f) => `<label><input type="checkbox" name="u-fn" value="${f.id}" ${member(f) ? "checked" : ""} ${u && f.lead === u.id ? "disabled" : ""}> ${esc(L(f))}</label>`).join("")}</div></fieldset>
    <div class="fields-2"><div class="field"><label for="dl-mgr">${t("cols.manager")}</label><select id="dl-mgr"><option value="">${t("misc.none")}</option>${S.d.users.filter((x) => x.roles.includes("manager") && x.id !== u?.id).map((x) => `<option value="${x.id}" ${u?.manager === x.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></div>
      <div class="field"><label for="dl-hours">${t("cols.hours")}</label><input type="number" id="dl-hours" min="0" max="80" step="1" value="${u?.hours ?? 0}"></div></div>
    <div class="fields-2"><div class="field"><label for="dl-lang">${t("usr.language")}</label><select id="dl-lang"><option value="fr">Français</option><option value="en">English</option></select></div>
      ${u ? `<div class="field"><span class="lbl">${t("cols.status")}</span><label class="checks"><label><input type="checkbox" id="dl-active" ${u.active ? "checked" : ""}> ${t("usr.active")}</label></label></div>` : "<div></div>"}</div>`, u ? t("misc.save") : t("usr.create"), (d) => {
    const name = d.querySelector("#dl-name").value.trim(), email = d.querySelector("#dl-email").value.trim();
    if (!name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast(t("usr.needName")); return; }
    const roles = [...d.querySelectorAll('[name="u-role"]:checked')].map((x) => x.value);
    const fnIds = [...d.querySelectorAll('[name="u-fn"]:checked')].map((x) => x.value);
    const target = u || { id: uid("u"), skills: [], active: true };
    Object.assign(target, { name, email, roles: roles.length ? roles : ["ae"], manager: d.querySelector("#dl-mgr").value || null, hours: +d.querySelector("#dl-hours").value || 0 });
    if (u) target.active = d.querySelector("#dl-active").checked;
    else { S.d.users.push(target); }
    for (const f of S.d.fns) {
      if (f.lead === target.id) continue;
      const has = f.members.includes(target.id), want = fnIds.includes(f.id);
      if (want && !has) f.members.push(target.id);
      if (!want && has) f.members = f.members.filter((x) => x !== target.id);
    }
    if (fnIds.length && !target.roles.includes("specialist") && !target.roles.includes("lead")) target.roles.push("specialist");
    toast(u ? t("usr.updated") : t("usr.created", { n: name, e: email })); render();
  }, false, true);
}

    <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="lbl req">${t("typ.types")}</legend><div class="checks">${Object.keys(ENG_TYPES).map((k) => `<label><input type="checkbox" name="t-type" value="${k}" ${f?.types.includes(k) ? "checked" : ""}> ${esc(ENG_TYPES[k][S.lang === "fr" ? 1 : 0])}</label>`).join("")}</div></fieldset>

/* ───────────────────────── events ───────────────────────── */
function persistDraft(silent) {
  const d = S.draft; if (!d) return;
  const { target, ...answers } = d.a;
  let r = d.reqId && reqById(d.reqId);
  if (!r) { r = { id: uid("r"), opp: d.opp, requester: me().id, fn: d.fn, status: "draft", answers, target, events: [{ from: null, to: "draft", by: me().id, at: new Date().toISOString() }], assignee: null, effort: [], outcome: null, version: 1 }; S.d.requests.push(r); d.reqId = r.id; }
  Object.assign(r, { fn: d.fn, opp: d.opp, answers, target });
  d.savedAt = new Date().toLocaleTimeString(locale(), { hour: "2-digit", minute: "2-digit" });
  const el = $("#saved-at"); if (el) el.textContent = t("req.draftSaved", { t: d.savedAt });
  if (!silent) toast(t("req.draftSaved", { t: d.savedAt }));
}
function refreshScore() { const el = $("#score"); if (el && S.draft) el.innerHTML = scorePanel({ ...S.draft.a, fn: S.draft.fn }, !!S.draft.opp); clearTimeout(refreshScore.h); refreshScore.h = setTimeout(() => persistDraft(true), 1200); }

document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.dataset.field && S.draft) { S.draft.a[el.dataset.field] = el.type === "checkbox" ? el.checked : el.value; refreshScore(); }
  else if (el.dataset.multi && S.draft) { const k = el.dataset.multi; S.draft.a[k] = [...document.querySelectorAll(`[data-multi="${k}"]:checked`)].map((x) => x.value); refreshScore(); }
  else if (el.dataset.att !== undefined && S.draft) { S.draft.a.attendees[+el.dataset.att][el.dataset.k] = el.value; refreshScore(); }
  else if (el.dataset.stage) { const s = stage(el.dataset.stage), k = el.dataset.k; s[k] = el.type === "checkbox" ? el.checked : k === "prob" ? Math.max(0, Math.min(100, +el.value)) : k === "target" ? Math.max(0, +el.value || 0) : el.value; if (k === "won" && s.won) s.lost = false; if (k === "lost" && s.lost) s.won = false; }
});
document.addEventListener("change", (e) => {
  const el = e.target, act = el.dataset.act;
  if (act === "role") { S.role = el.value; store("clean.role", S.role); S.draft = null; S.bell = false; if (!["#home", ""].includes(location.hash)) location.hash = "home"; else render(); }
  else if (act === "lang-select") { S.lang = el.value; store("clean.lang", S.lang); render(); }
  else if (act === "ws") { applyWorkspace(el.value); if (S.ws === "meca" && S.lang !== "fr") { S.lang = "fr"; store("clean.lang", "fr"); } toast(WS().org); if (location.hash !== "#home") location.hash = "home"; else render(); }
  else if (act === "move") moveDeal(el.dataset.opp, el.value);
  else if (act === "filter") { S.filters[el.dataset.k] = el.value; render(); }
  else if (act === "pick-fn") { S.draft.fn = el.value; S.draft.a.type = ""; render(); }
  else if (act === "pick-deal") { S.draft.opp = el.value || null; refreshScore(); }
  else if (act === "user-role-filter") { S.filters.userRole = el.value; render(); }
  else if (act === "pick-tpl") { S.tpl = el.value; render(); }
  else if (act === "notes") { document.body.classList.toggle("hide-notes", !el.checked); }
  else if (el.dataset.roleUser) { const u = user(el.dataset.roleUser); u.roles = el.checked ? [...new Set([...u.roles, el.value])] : u.roles.filter((x) => x !== el.value); toast(t("adm.saved")); }
  else if (el.dataset.manager) { user(el.dataset.manager).manager = el.value || null; toast(t("adm.saved")); }
  else if (el.dataset.stage) { toast(t("adm.saved")); render(); }
});
function moveDeal(oppId, to) {
  const o = opp(oppId); if (!o || o.stage === to) return;
  o.history.push({ from: o.stage, to, at: iso(TODAY) }); o.stage = to; o.moved = iso(TODAY);
  toast(`${o.name} → ${L(stage(to))}`); render();
}
document.addEventListener("submit", (e) => {
  if (e.target.method === "dialog") return; // let <dialog> forms close natively
  e.preventDefault();
  if (e.target.id === "req-form") {
    persistDraft(true);
    const r = reqById(S.draft.reqId), f = fn(r.fn);
    transition(r, "new"); notify(f.lead, `New request from ${me().name} needs triage.`, `Nouvelle demande de ${me().name} à trier.`, "triage");
    S.draft = null; toast(t("req.submitted", { f: L(f) })); location.hash = `request-${r.id}`;
  } else if (e.target.dataset.form === "signin") { S.authEmail = $("#au-email").value; S.authStep = "sent"; render(); }
});
document.addEventListener("click", (e) => {
  const row = e.target.closest("tr[data-href]");
  if (row && !e.target.closest("a, button, input, select")) { location.hash = row.dataset.href; return; }
  const b = e.target.closest("[data-act]"); if (!b || b.tagName === "SELECT" || (b.tagName === "INPUT" && b.type !== "button")) { if (S.bell && !e.target.closest(".dropdown")) { S.bell = false; render(); } return; }
  const act = b.dataset.act, id = b.dataset.id;
  const r = id && reqById(id);
  switch (act) {
    case "menu": document.body.classList.toggle("nav-open"); b.setAttribute("aria-expanded", document.body.classList.contains("nav-open")); break;
    case "view": S.view = b.dataset.v; render(); break;
    case "bell": S.bell = !S.bell; render(); break;
    case "read-n": { const n = S.d.notifications.find((x) => x.id === id); if (n) n.unread = false; S.bell = false; break; }
    case "period": S.period = b.dataset.v; render(); break;
    case "reset": S.d = withQuotes(WS().seed(), S.ws); S.draft = null; S.setupStep = 1; toast(t("reset")); render(); break;
    case "signout": S.authStep = "email"; break;
    case "sso": toast(t("notes.signin").replace(/<[^>]+>/g, "").split(".")[0]); break;
    case "auth-open": S.authStep = "org"; render(); break;
    case "auth-reset": S.authStep = "email"; render(); break;
    case "auth-org": S.authStep = "email"; break;
    case "add-attendee": S.draft.a.attendees.push({ name: "", title: "", role: "unknown" }); $("#attendees").insertAdjacentHTML("beforeend", attendeeRow(S.draft.a.attendees.at(-1), S.draft.a.attendees.length - 1)); refreshScore(); break;
    case "rm-attendee": S.draft.a.attendees.splice(+b.dataset.i, 1); $("#attendees").innerHTML = S.draft.a.attendees.map(attendeeRow).join(""); refreshScore(); break;
    case "save-draft": persistDraft(false); break;
    case "tri-accept": { const f = fn(r.fn); openDialog(t("tri.accept"), `<div class="field"><label for="dl-who">${t("tri.assignTo")}</label><select id="dl-who">${memberOptions(f)}</select></div>`, t("tri.accept"), (d) => { const who = d.querySelector("#dl-who").value; if (r.status === "needs_information") transition(r, "new"); if (transition(r, "accepted")) { r.assignee = who; notify(who, `You were assigned “${reqTitle(r)}”.`, `Vous êtes affecté(e) à « ${reqTitle(r)} ».`, `request-${r.id}`); notify(r.requester, `${me().name} accepted your request.`, `${me().name} a accepté votre demande.`, `request-${r.id}`); toast(t("tri.accepted", { who: user(who).name })); render(); } }); break; }
    case "tri-decline": openDialog(t("tri.decline"), `<div class="field"><label for="dl-why" class="req">${t("tri.reason")}</label><textarea id="dl-why" required></textarea></div>`, t("tri.decline"), (d) => { if (transition(r, "declined", d.querySelector("#dl-why").value)) { notify(r.requester, `Your request was declined.`, `Votre demande a été refusée.`, `request-${r.id}`); toast(t("tri.declined")); render(); } }, true); break;
    case "tri-ask": openDialog(t("tri.askInfo"), `<div class="field"><label for="dl-q" class="req">${t("tri.question")}</label><textarea id="dl-q" required></textarea></div>`, t("tri.askInfo"), (d) => { if (transition(r, "needs_information", d.querySelector("#dl-q").value)) { notify(r.requester, `${me().name} asked for information.`, `${me().name} demande des précisions.`, `request-${r.id}`); toast(t("tri.asked", { who: user(r.requester).name })); render(); } }); break;
    case "tri-reassign": { const f = fn(r.fn); openDialog(t("tri.reassign"), `<div class="field"><label for="dl-who">${t("tri.assignTo")}</label><select id="dl-who">${memberOptions(f, r.assignee)}</select></div>`, t("tri.reassign"), (d) => { r.assignee = d.querySelector("#dl-who").value; r.events.push({ from: r.status, to: r.status, by: me().id, at: new Date().toISOString(), note: `→ ${user(r.assignee).name}` }); toast(t("tri.reassigned", { who: user(r.assignee).name })); render(); }); break; }
    case "resubmit": if (transition(r, "new")) { toast(t("req.submitted", { f: L(fn(r.fn)) })); render(); } break;
    case "withdraw": openDialog(t("req.withdraw"), `<p>${esc(reqTitle(r))}</p>`, t("req.withdraw"), () => { if (transition(r, "withdrawn")) render(); }, true); break;
    case "schedule": openDialog(t("req.schedule"), `<div class="field"><label for="dl-date">${t("req.date")}</label><input type="date" id="dl-date" value="${r.target}" min="${iso(TODAY)}" required></div>`, t("req.schedule"), (d) => { if (transition(r, "scheduled")) { r.booking = d.querySelector("#dl-date").value; toast(t("req.scheduled", { d: fmtDate(r.booking) })); render(); } }); break;
    case "deliver": if (transition(r, "delivered")) render(); break;
    case "log-effort": openDialog(t("req.logEffort"), `<div class="inline-fields"><div class="field"><label for="dl-h">${t("req.hours")}</label><input type="number" id="dl-h" min="0.25" max="24" step="0.25" value="2" required></div><div class="field"><label for="dl-a">${t("req.activity")}</label><select id="dl-a">${Object.keys(I18N.en.act).map((k) => `<option value="${k}">${t("act." + k)}</option>`).join("")}</select></div><div class="field"><label for="dl-d">${t("req.date")}</label><input type="date" id="dl-d" value="${iso(TODAY)}" required></div></div>`, t("misc.save"), (d) => { r.effort.push({ user: me().id, hours: +d.querySelector("#dl-h").value, activity: d.querySelector("#dl-a").value, date: d.querySelector("#dl-d").value }); render(); }); break;

/* CSV import */
function parseCsv(text) {
  const rows = text.split(/\r?\n/).filter((l) => l.trim()).map((l) => { const out = []; let cur = "", q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === "," && !q) { out.push(cur.trim()); cur = ""; } else cur += ch; } out.push(cur.trim()); return out; });
  if (rows.length && rows[0][0].toLowerCase() === "name") rows.shift();
  return rows.map(([name = "", country = "", industry = "", rel = "new_logo"]) => {
    const errors = []; if (!name) errors.push("name"); if (country && !/^[A-Za-z]{2}$/.test(country)) errors.push("country"); if (!["new_logo", "expand", "retain"].includes(rel)) errors.push("relationship");
    return { name, country: country.toUpperCase(), industry, rel, errors };
  });
}
function openImport() {
  const sample = "name,country,industry,relationship\nKestrel Shipping,DK,Logistics,new_logo\nLoire Valley Wines,FR,Food & beverage,expand\nMeridian Clinics,XX1,Healthcare,retain\n,FR,Retail,new_logo";
  openDialog(t("acc.importTitle"), `<p class="muted small">${t("acc.importHint")}</p><input type="file" id="dl-file" accept=".csv,text/csv" aria-label="${t("acc.chooseFile")}"><textarea id="dl-csv" style="font-family:var(--mono);font-size:0.8rem;min-height:110px">${sample}</textarea><div id="dl-prev"></div>`, t("acc.import"), (d) => {
    const ok = parseCsv(d.querySelector("#dl-csv").value).filter((r) => !r.errors.length);
    ok.forEach((r) => S.d.accounts.push({ id: uid("a"), name: r.name, country: r.country, industry: r.industry, rel: r.rel, owner: me().id }));
    toast(t("acc.imported", { n: ok.length })); render();
  });
  const d = $("#dlg"), prev = () => { const rows = parseCsv(d.querySelector("#dl-csv").value), bad = rows.filter((r) => r.errors.length).length;
    d.querySelector("#dl-prev").innerHTML = `<div class="chips"><span class="chip good">${t("acc.rowsOk", { n: rows.length - bad })}</span>${bad ? `<span class="chip bad">${t("acc.rowsBad", { n: bad })}</span>` : ""}</div><div class="table-wrap" style="max-height:180px;margin-top:8px"><table><tbody>${rows.map((r) => `<tr><td>${esc(r.name) || "<em>?</em>"}</td><td>${esc(r.country)}</td><td>${r.errors.length ? `<span class="chip bad">${esc(r.errors.join(", "))}</span>` : `<span class="chip good">✓</span>`}</td></tr>`).join("")}</tbody></table></div>`; };
  d.querySelector("#dl-csv").addEventListener("input", prev);
  d.querySelector("#dl-file").addEventListener("change", (e) => { const f = e.target.files[0]; if (!f) return; const fr = new FileReader(); fr.onload = () => { d.querySelector("#dl-csv").value = fr.result; prev(); }; fr.readAsText(f); });
  prev();
}

  return `<svg class="ring-svg" width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="${esc(label)}"><circle cx="36" cy="36" r="28" fill="none" stroke="#E6EAF1" stroke-width="8"/>${v ? `<circle cx="36" cy="36" r="28" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${((v / 100) * C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 36 36)"/>` : ""}<text x="36" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#141A26">${v} %</text></svg>`;
}
function ringCard({ label, value, detail, bad, pct: p, color = "var(--accent)", ico = "money", ringLabel }) {
  return `<article class="ring-card"><div class="rc-head"><span class="rc-ico">${icon(ico, 16)}</span><h3 style="margin:0;font-size:inherit">${esc(label)}</h3></div><div class="rc-body"><div><p class="rc-v num">${esc(String(value))}</p>${detail ? `<p class="rc-d ${bad ? "bad" : ""}">${esc(detail)}</p>` : ""}</div>${p == null ? "" : ringSvg(p, color, ringLabel || `${p} %`)}</div></article>`;
}
function stageBars(opps) {
  const open = opps.filter(isOpenOpp), os = openStages();
  const rows = os.map((s) => { const xs = open.filter((o) => o.stage === s.id); const v = sum(xs, (o) => o.amount); return { s, v, w: Math.round(v * s.prob / 100) }; });
  const maxV = Math.max(1, ...rows.map((r) => r.v)), step = 10 ** Math.floor(Math.log10(maxV)) / 2, top = Math.ceil(maxV / step / 4) * step * 4 || 1;
  const k = (n) => (n >= 1e6 ? `${+(n / 1e6).toFixed(1)} M` : n >= 1e3 ? `${Math.round(n / 1e3)} k` : String(n));
  const weighted = sum(rows, (r) => r.w), n = os.length;
  const desc = rows.map((r) => `${L(r.s)} ${money(r.v)} / ${money(r.w)}`).join(" · ");
  return `<section class="panel bars-card"><div class="bars-head"><div><h2 style="margin:0;font-size:15px">${t("ui.byStage")}</h2><p class="big num">${money(weighted)}</p><p class="muted small">${t("ui.weightedLead")}</p></div><div class="bars-legend"><span><b style="background:#D7DCE5"></b>${t("ui.value")}</span><span><b style="background:var(--accent)"></b>${t("ui.weighted")}</span></div></div>
    <div class="vbars" role="img" aria-label="${esc(desc)}"><div class="vbars-axis" aria-hidden="true">${[4, 3, 2, 1, 0].map((i) => `<span>${k((top / 4) * i)}</span>`).join("")}</div>
      <div class="vbars-plot" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${rows.map((r) => `<div class="vbars-col" title="${esc(L(r.s))}: ${money(r.v)} · ${money(r.w)}"><i style="background:#D7DCE5;height:${(r.v / top) * 100}%"></i><i style="background:var(--accent);height:${(r.w / top) * 100}%"></i></div>`).join("")}</div>
      <span></span><div class="vbars-x" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${rows.map((r) => `<span>${esc(L(r.s))}</span>`).join("")}</div></div></section>`;
}
function gauge(title, items, centerLabel) {
  const total = sum(items, (x) => x.count), Lg = Math.PI * 82; let start = 0;
  const arcs = total ? items.filter((x) => x.count).map((x) => { const len = (x.count / total) * Lg; const a = `<path d="M 18 100 A 82 82 0 0 1 182 100" fill="none" stroke="${x.color}" stroke-width="22" stroke-dasharray="${Math.max(0, len - 2.5).toFixed(2)} ${Lg.toFixed(2)}" stroke-dashoffset="${(-start).toFixed(2)}"/>`; start += len; return a; }).join("") : "";
  return `<section class="panel"><header><h2>${esc(title)}</h2></header><div class="body"><div class="gauge"><svg viewBox="0 0 200 110" width="100%" role="img" aria-label="${esc(items.map((x) => `${x.label} ${x.count}`).join(", "))}"><path d="M 18 100 A 82 82 0 0 1 182 100" fill="none" stroke="#EEF1F6" stroke-width="22"/>${arcs}</svg><div class="gauge-center"><p class="num">${total}</p><p>${esc(centerLabel)}</p></div></div>
    <ul class="legend-list">${items.map((x) => `<li><i style="background:${x.color}"></i><span>${esc(x.label)}</span><strong class="num">${x.count}</strong></li>`).join("")}</ul></div></section>`;
}
